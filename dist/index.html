  /* ------------------------------------------------------------- class --- */
  function Boss(game, kind, x, y, opts) {
    opts = opts || {};
    var d = DEFS[kind] || DEFS.warden;
    this.game = game;
    this.kind = kind;
    this.def = d;
    this.isBoss = true;
    this.tier = opts.tier || 1;

    var scale = 1 + (this.tier - 1) * 0.10;
    this.body = new G.Body(x, y - d.h, d.w, d.h);
    this.body.gravityScale = d.flying ? 0 : 1;
    this.maxHp = Math.round(d.hp * scale);
    this.hp = this.maxHp;
    this.dmg = d.dmg * scale;
    this.speed = d.speed;
    this.facing = -1;

    this.phase = 1;
    this.maxPhase = d.phaseAt.length;
    this.transition = 0;
    this.introT = opts.intro === false ? 0 : 2.0;
    this.spawning = 0;
    this.dead = false;
    this.deadT = 0;
    this.elite = false;
    this.aggro = true;

    this.poiseMax = d.poise;
    this.poise = this.poiseMax;
    this.staggerT = 0;
    this.hurtFlash = 0;

    this.action = null;
    this.actName = '';
    this.actPhase = '';
    this.actT = 0;
    this.actHitDone = false;
    this.actCd = 0.9;
    this.nextChain = null;

    this.animT = 0;
    this.runCycle = 0;
    this.state = 'idle';
    this.eyeGlow = 0.4;
    this.lanceOn = 0;
    this.lanceAim = 0;
    this.whirlSpin = 0;
    this.hoverPhase = 0;
    this.homeY = y - d.h;

    this.rig = A.makeRig(d.rig);
    this.pose = P.idle;
  }

  Boss.DEFS = DEFS;

  Boss.prototype.hurtbox = function () {
    var b = this.body;
    return { x: b.x - 3, y: b.y - 3, w: b.w + 6, h: b.h + 6 };
  };

  Boss.prototype.forceStagger = function (dur) {
    this.staggerT = Math.max(this.staggerT, dur);
    this.action = null; this.actPhase = ''; this.nextChain = null;
    this.state = 'stagger';
    this.game.floatText.add(this.body.cx(), this.body.y - 14, 'STAGGERED', '#ffd76b', 15);
  };

  Boss.prototype.onPoiseBreak = function () { this.forceStagger(1.15); };

  Boss.prototype.stagger = function (dur) {
    // parry stagger — shorter on bosses, but a real punish window
    this.forceStagger(Math.min(dur, 0.85));
  };

  Boss.prototype.takeDamage = function (amount, dirX, opts) {
    opts = opts || {};
    if (this.dead) return 'dead';
    if (this.transition > 0 || this.introT > 0) return 'iframe';

    // staggered bosses take extra damage — rewards the parry
    if (this.staggerT > 0) amount *= 1.45;

    this.hp -= amount;
    this.hurtFlash = 1;
    this.poise -= amount + (opts.heavy ? 26 : 0);

    var kb = (opts.kb || 200) * 0.10;
    this.body.vx += M.sign(dirX || 1) * kb;

    this.game.floatText.add(this.body.cx() + (Math.random() - 0.5) * 14, this.body.y - 6,
      Math.round(amount), opts.heavy ? '#ffd76b' : '#ffffff', opts.heavy ? 17 : 13);

    if (this.poise <= 0) { this.poise = this.poiseMax; this.onPoiseBreak(); }

    // phase gate
    var frac = this.hp / this.maxHp;
    if (this.phase < this.maxPhase && frac <= this.def.phaseAt[this.phase]) {
      this.enterPhase(this.phase + 1);
    }
    if (this.hp <= 0) this.die(dirX);
    return 'hit';
  };

  Boss.prototype.enterPhase = function (n) {
    this.phase = n;
    // Keep the phase spectacle brisk enough that the boss never feels stuck
    // in an invulnerable transition after a threshold is crossed.
    // Hit-stop also pauses this timer, so keep the visible transition short
    // enough that combat cannot leave the boss immune for an excessive time.
    this.transition = 0.9;
    this.action = null; this.actPhase = ''; this.nextChain = null;
    this.staggerT = 0;
    this.poise = this.poiseMax;
    this.hp = Math.max(this.hp, 1);
    var g = this.game, b = this.body;
    g.camera.addShake(20);
    g.flash.pop(0.5, '#ffd0a0');
    g.hitstop.add(0.22, 0.05);
    g.particles.shockwave(b.cx(), b.cy(), 300, '#ffcf8a');
    for (var i = 0; i < 60; i++) {
      var a = Math.random() * 6.28, sp = 120 + Math.random() * 420;
      g.particles.spawn({
        x: b.cx(), y: b.cy(), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.6, size: 2 + Math.random() * 4,
        col: Math.random() < 0.5 ? '#ffd76b' : '#ff8a4a', kind: 1, drag: 2.2, glow: 1
      });
    }
    G.Audio.play('bossRoar');
    g.floatText.add(b.cx(), b.y - 24, 'PHASE ' + n, '#ffd76b', 20, -30);
    // each phase makes the boss meaner
    this.speed = this.def.speed * (1 + (n - 1) * 0.16);
    this.dmg = this.def.dmg * (1 + (n - 1) * 0.13) * (1 + (this.tier - 1) * 0.10);
  };

  Boss.prototype.die = function () {
    if (this.dead) return;
    this.dead = true; this.deadT = 0; this.hp = 0;
    var g = this.game, b = this.body;
    g.camera.addShake(24);
    g.flash.pop(0.75, '#fff2d0');
    g.hitstop.add(0.35, 0.03);
    g.particles.death(b.cx(), b.cy(), this.rig.mid);
    g.particles.shockwave(b.cx(), b.cy(), 360, '#fff2d0');
    G.Audio.play('bossRoar');
    g.grantXp(Math.round(this.def.xp * (1 + (this.tier - 1) * 0.2)), b.cx(), b.cy());
    g.spawnGold(b.cx(), b.cy(), Math.round(this.def.gold * (g.player.fortuneMul || 1)));
    g.onBossKilled(this);
  };

  /* ------------------------------------------------------------ update -- */
  Boss.prototype.update = function (dt, world) {
    var g = this.game, p = g.player, b = this.body, d = this.def;
    this.animT += dt;
    this.hurtFlash = Math.max(0, this.hurtFlash - dt * 3.2);

    if (this.dead) {
      this.deadT += dt;
      if (!d.flying) { b.applyGravity(dt); b.vx = M.approach(b.vx, 0, 700 * dt); b.move(world, dt); }
      this.pose = A.mix(this.pose, P.dead, Math.min(1, dt * 5));
      if (this.deadT < 2.2 && Math.random() < 0.35) {
        g.particles.spawn({
          x: b.cx() + (Math.random() - 0.5) * b.w, y: b.y + Math.random() * b.h,
          vx: (Math.random() - 0.5) * 60, vy: -70 - Math.random() * 130,
          life: 0.6, size: 2 + Math.random() * 5, col: '#ffcf8a', kind: 1, drag: 1.6, glow: 1
        });
      }
      return;
    }

    /* intro: roar, no attacks */
    if (this.introT > 0) {
      this.introT -= dt;
      if (Math.abs(this.introT - 1.3) < dt) { G.Audio.play('bossRoar'); g.camera.addShake(12); }
      b.vx = M.approach(b.vx, 0, 600 * dt);
      if (p) this.facing = M.sign(p.body.cx() - b.cx()) || this.facing;
      this.pose = A.mix(this.pose, this.introT > 0.9 ? P.atk3a : P.idle, Math.min(1, dt * 6));
      this.physics(dt, world);
      this.eyeGlow = 0.5 + Math.sin(this.animT * 9) * 0.25;
      return;
    }

    /* phase transition: invulnerable, staggered open */
    if (this.transition > 0) {
      this.transition -= dt;
      b.vx = M.approach(b.vx, 0, 800 * dt);
      this.pose = A.mix(this.pose, this.transition > 0.7 ? P.atk3a : P.idle, Math.min(1, dt * 6));
      this.physics(dt, world);
      this.eyeGlow = 1.2;
      if (Math.random() < 0.5) {
        g.particles.ember(b.cx() + (Math.random() - 0.5) * b.w, b.y + b.h);
      }
      return;
    }

    if (this.poise < this.poiseMax) this.poise = Math.min(this.poiseMax, this.poise + this.poiseMax * 0.28 * dt);
    this.actCd = Math.max(0, this.actCd - dt);

    if (this.staggerT > 0) {
      this.staggerT -= dt;
      this.state = 'stagger';
      b.vx = M.approach(b.vx, 0, 400 * dt);
      this.pose = A.mix(this.pose, P.hurt, Math.min(1, dt * 16));
      this.physics(dt, world);
      this.eyeGlow = 0.15;
      if (this.staggerT <= 0) { this.state = 'idle'; this.actCd = 0.35; }
      return;
    }

    var alive = p && !p.dead;
    var dx = alive ? p.body.cx() - b.cx() : 0;
    var dist = alive ? M.len(dx, p.body.cy() - b.cy()) : 999;

    /* ------------------------------------------------------ action runner */
    if (this.action) {
      var a = this.action;
      this.actT += dt;
      if (this.actPhase === 'tell') {
        var kt = M.clamp(this.actT / a.tell, 0, 1);
        if (a.onTell) a.onTell(this, dt, kt);
        else if (alive && kt < 0.55) this.facing = M.sign(dx) || this.facing;
        b.vx = M.approach(b.vx, 0, 700 * dt);
        if (this.actT >= a.tell) {
          this.actPhase = 'act'; this.actT = 0; this.actHitDone = false;
          if (a.onStrike) a.onStrike(this);
          if (a.move) b.vx = this.facing * a.move;
        }
      } else if (this.actPhase === 'act') {
        var ka = M.clamp(this.actT / a.act, 0, 1);
        if (a.onActive) a.onActive(this, dt, ka);
        if (this.actT >= a.act) {
          this.actPhase = 'rec'; this.actT = 0;
          if (a.onEnd) a.onEnd(this);
        }
      } else {
        b.vx = M.approach(b.vx, 0, 600 * dt);
        if (this.actT >= a.rec) {
          var chainTo = a.chain;
          this.action = null; this.actPhase = '';
          // chain into the follow-up if the player is still in range
          if (chainTo && Math.abs(dx) < 130 && Math.random() < 0.82) this.startAction(chainTo);
          else this.actCd = 0.45 + Math.random() * 0.55;
        }
      }
      this.updatePose(dt);
      this.physics(dt, world);
      this.eyeGlow = 0.35 + (this.actPhase === 'tell' ? M.clamp(this.actT / this.action_tell(), 0, 1) * 0.9 : 0.3);
      return;
    }

    /* --------------------------------------------------------- approach -- */
    this.state = 'chase';
    if (alive) this.facing = M.sign(dx) || this.facing;

    if (this.actCd <= 0 && alive) {
      var name = d.pick(this, dist);
      var chosen = d.actions[name];
      // respect phase gating on actions
      if (chosen && chosen.phase && this.phase < chosen.phase) name = d.flying ? 'volley' : 'combo1';
      if (!d.actions[name]) name = Object.keys(d.actions)[0];
      this.startAction(name);
    } else {
      var want = 0;
      if (dist > 90) want = M.sign(dx);
      else if (dist < 52) want = -M.sign(dx);
      if (!d.flying && want !== 0) {
        var ax = b.cx() + want * (b.w * 0.6 + 8);
        var ty = Math.floor((b.y + b.h + 8) / K.TILE);
        if (!world.isSolid(Math.floor(ax / K.TILE), ty) && !world.isPlatform(Math.floor(ax / K.TILE), ty)) want = 0;
      }
      b.vx = M.approach(b.vx, want * this.speed, 800 * dt);
    }

    this.updatePose(dt);
    this.physics(dt, world);
    this.eyeGlow = 0.4 + Math.sin(this.animT * 3) * 0.1;
  };

  Boss.prototype.action_tell = function () { return this.action ? Math.max(0.01, this.action.tell) : 1; };

  Boss.prototype.startAction = function (name) {
    var a = this.def.actions[name];
    if (!a) return;
    this.action = a; this.actName = name;
    this.actPhase = 'tell'; this.actT = 0;
    this.actHitDone = false;
    if (a.onStart) a.onStart(this);
  };

  Boss.prototype.physics = function (dt, world) {
    var b = this.body, d = this.def;
    if (d.flying) {
      var p = this.game.player;
      var targetY = p && !p.dead ? p.body.cy() - 54 : this.homeY;
      var bob = Math.sin(this.animT * 1.9 + this.hoverPhase) * 14;
      if (this.actPhase !== 'act') b.vy = M.damp(b.vy, ((targetY + bob) - b.cy()) * 2.6, 6, dt);
      b.move(world, dt);
    } else {
      b.applyGravity(dt);
      b.move(world, dt);
    }
    if (b.y > world.pixelH() + 200) { b.y = world.pixelH() - b.h - K.TILE * 3; b.vy = 0; }
  };

  Boss.prototype.updatePose = function (dt) {
    var target, blend = 14, a = this.action;
    if (a && this.actPhase) {
      var pw = P[a.poseW] || P.atk1a, ps = P[a.poseS] || P.atk1b;
      if (this.actPhase === 'tell') {
        target = A.mix(P.idle, pw, M.easeOutCubic(M.clamp(this.actT / a.tell, 0, 1)));
        blend = 24;
      } else if (this.actPhase === 'act') {
        target = A.mix(pw, ps, M.easeOutCubic(M.clamp(this.actT / a.act, 0, 1)));
        blend = 40;
      } else {
        target = A.mix(ps, P.idle, M.smoothstep(M.clamp(this.actT / a.rec, 0, 1)));
        blend = 14;
      }
    } else if (Math.abs(this.body.vx) > 24) {
      this.runCycle += dt * (3.6 + Math.abs(this.body.vx) / 74);
      var ph = Math.sin(this.runCycle) * 0.5 + 0.5;
      target = A.mix(P.run, P.runB, ph);
      target.bob = Math.abs(Math.cos(this.runCycle)) * -2.4;
      blend = 16;
    } else {
      target = A.mix(P.idle, P.idle, 0);
      target.bob = Math.sin(this.animT * 1.5) * 1.4;
      blend = 8;
    }
    if (!this.body.onGround && !this.def.flying) target = A.mix(target, this.body.vy < 0 ? P.jump : P.fall, 0.6);
    this.pose = A.mix(this.pose, target, Math.min(1, blend * dt));
    this.pose.capeA = M.lerp(this.pose.capeA, 0.3 + M.clamp(Math.abs(this.body.vx) / 240, 0, 1.4), Math.min(1, dt * 7));
  };

  Boss.prototype.snapshotPose = function () {
    var o = {}; for (var k in this.pose) o[k] = this.pose[k];
    return o;
  };

  /* -------------------------------------------------------------- draw -- */
  Boss.prototype.draw = function (ctx) {
    var b = this.body, d = this.def;
    var alpha = this.dead ? Math.max(0, 1 - this.deadT / 2.6) : 1;
    if (this.blinkFade) alpha *= 0.25;

    var flat = null;
    if (this.hurtFlash > 0.5) flat = 'rgba(255,245,240,0.95)';
    if (this.transition > 0 && Math.floor(this.transition * 14) % 2 === 0) flat = 'rgba(255,220,170,0.9)';

    // ground shadow anchors the big silhouette
    if (!d.flying) {
      ctx.save();
      ctx.globalAlpha = 0.35 * alpha;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(b.cx(), b.y + b.h - 1, b.w * 0.85, 5, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    if (this.actName === 'whirl' && this.actPhase === 'act') {
      // spin visual: squash-rotate the whole rig
      ctx.translate(b.cx(), b.cy());
      ctx.scale(Math.cos(this.whirlSpin) >= 0 ? 1 : -1, 1);
      ctx.translate(-b.cx(), -b.cy());
    }
    A.drawHumanoid(ctx, this.rig, this.pose, b.cx(), b.cy() - 2, this.facing, {
      alpha: alpha, eyeGlow: this.eyeGlow, eyeCol: d.rig.eyeCol, flat: flat,
      weaponGlow: this.actPhase === 'act' ? 0.8 : 0.2,
      rimStrength: 0.6 + (this.actPhase === 'tell' ? 0.4 : 0)
    });
    ctx.restore();

    if (this.dead) return;

    /* lance beam */
    if (this.lanceOn > 0) {
      var len = 420;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var lg = ctx.createLinearGradient(b.cx(), 0, b.cx() + this.facing * len, 0);
      lg.addColorStop(0, 'rgba(220,180,255,0.95)');
      lg.addColorStop(1, 'rgba(150,90,255,0)');
      ctx.fillStyle = lg;
      var hh = 15 * (0.5 + Math.sin(this.animT * 40) * 0.1 + this.lanceOn * 0.5);
      ctx.fillRect(this.facing > 0 ? b.cx() : b.cx() - len, b.cy() - hh, len, hh * 2);
      ctx.restore();
    }
    /* lance aim line during tell */
    if (this.actName === 'lance' && this.actPhase === 'tell') {
      ctx.save();
      ctx.globalAlpha = 0.25 + this.lanceAim * 0.5;
      ctx.strokeStyle = '#c08aff';
      ctx.lineWidth = 1 + this.lanceAim * 2;
      ctx.setLineDash([9, 7]);
      ctx.beginPath();
      ctx.moveTo(b.cx(), b.cy());
      ctx.lineTo(b.cx() + this.facing * 420, b.cy());
      ctx.stroke();
      ctx.restore();
    }

    /* telegraph ring */
    if (this.actPhase === 'tell' && this.action) {
      var k = M.clamp(this.actT / this.action.tell, 0, 1);
      var warn = this.action.unblockable ? [255, 90, 60] : [255, 205, 130];
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.25 + k * 0.55;
      ctx.strokeStyle = 'rgba(' + warn.join(',') + ',0.95)';
      ctx.lineWidth = 2 + k * 2.5;
      ctx.beginPath();
      ctx.arc(b.cx(), b.cy(), 24 + (1 - k) * 40, 0, 6.2832);
      ctx.stroke();
      ctx.restore();
      if (this.action.unblockable) {
        ctx.save();
        ctx.globalAlpha = 0.5 + k * 0.5;
        ctx.fillStyle = '#ff8a5a';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('!', b.cx(), b.y - 16);
        ctx.restore();
      }
    }

    /* stagger prompt */
    if (this.staggerT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.6 + Math.sin(this.animT * 16) * 0.3;
      ctx.fillStyle = '#ffd76b';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PUNISH', b.cx(), b.y - 14);
      ctx.restore();
    }
  };

  Boss.prototype.drawGhost = function (ctx, gh) {
    A.drawHumanoid(ctx, this.rig, gh.pose || this.pose, gh.x + gh.w * 0.5, gh.y + gh.h * 0.5 - 2, gh.facing,
      { flat: gh.col, alpha: (gh.life / gh.max) * 0.55, rim: false, eyeGlow: 0 });
  };

  Boss.prototype.lights = function (out) {
    var b = this.body;
    if (this.dead) {
      out.push({ x: b.cx(), y: b.cy(), r: 260 * Math.max(0, 1 - this.deadT / 2.2), col: [255, 210, 150], a: 0.7 });
      return;
    }
    var c = this.kind === 'choir' ? [190, 138, 255] : this.kind === 'valdris' ? [255, 210, 120] : [255, 130, 70];
    out.push({ x: b.cx(), y: b.cy() - b.h * 0.28, r: 120 + this.eyeGlow * 70, col: c, a: 0.35 + this.eyeGlow * 0.3 });
    if (this.transition > 0) out.push({ x: b.cx(), y: b.cy(), r: 380, col: [255, 200, 140], a: 0.7 });
    if (this.lanceOn > 0) out.push({ x: b.cx() + this.facing * 180, y: b.cy(), r: 260, col: [190, 138, 255], a: 0.6 });
    if (this.actPhase === 'tell' && this.action && this.action.unblockable) {
      out.push({ x: b.cx(), y: b.cy(), r: 180, col: [255, 110, 60], a: 0.45 * M.clamp(this.actT / this.action.tell, 0, 1) });
    }
  };

  return Boss;
})();


/* ==== 08_render.js ================================================== */
/* ==========================================================================
   GRIMHOLLOW  —  08_render.js
   Chunked terrain baking, per-biome parallax skies, additive light buffer,
   post-processing. This file is where "good graphics" actually happens: no
   art assets, so every pixel is drawn from noise, gradients and geometry.
   ========================================================================== */

var G = (typeof G !== 'undefined') ? G : {};

G.Biomes = {
  ruins: {
    name: 'The Ashen Ruins',
    // Keep the silhouette mood while leaving routes and climb bars readable.
    ambient: [0.42, 0.39, 0.50],
    fog: 'rgba(46,40,58,0.55)',
    sky: [['#0b0a12', 0], ['#1b1524', 0.55], ['#31212c', 1]],
    rock: { d: '#241f2a', m: '#3a3242', l: '#4e4459', edge: '#5d5168', moss: 'rgba(96,120,70,0.20)' },
    accent: '#c96a2a',
    ember: 0.55
  },
  caverns: {
    name: 'The Weeping Deep',
    ambient: [0.34, 0.38, 0.52],
    fog: 'rgba(26,34,56,0.6)',
    sky: [['#05070f', 0], ['#0a1020', 0.5], ['#122036', 1]],
    rock: { d: '#141a2a', m: '#1e2740', l: '#2c3855', edge: '#3a4a6c', moss: 'rgba(60,140,150,0.18)' },
    accent: '#4ec8d8',
    ember: 0.22
  },
  citadel: {
    name: 'Vault of the Hollow Crown',
    ambient: [0.38, 0.35, 0.45],
    fog: 'rgba(38,32,44,0.55)',
    sky: [['#080711', 0], ['#141020', 0.5], ['#241a2a', 1]],
    rock: { d: '#1b1822', m: '#282433', l: '#393246', edge: '#4a4257', moss: 'rgba(200,160,70,0.14)' },
    accent: '#e0b64a',
    ember: 0.40
  }
};

/* Repair any accidental non-ascii in palette literals at load time so a typo
   can never produce an invalid CSS colour (silent black terrain). */
(function sanitizeBiomes() {
  var ok = /^#[0-9a-fA-F]{3,8}$/;
  var fallbacks = { d: '#20202a', m: '#2c2c38', l: '#3d3d4c', edge: '#4d4d5e' };
  for (var b in G.Biomes) {
    var r = G.Biomes[b].rock;
    for (var k in r) {
      if (typeof r[k] === 'string' && r[k][0] === '#' && !ok.test(r[k])) r[k] = fallbacks[k] || '#303040';
    }
  }
})();

/* ============================================================== terrain === */
/* Levels are up to ~300x60 tiles = 7200x1440 px. Baking that whole thing into
   one offscreen canvas is ~40MB and stalls on load, so bake 512px chunks
   lazily as the camera reaches them and keep a bounded LRU. */
G.Terrain = (function () {
  var K = G.K, T = G.T, M = G.M;
  var CH = 512;                 // chunk size in px
  var MAX_CHUNKS = 40;

  function Terrain(world) {
    this.world = world;
    this.bio = G.Biomes[world.biome] || G.Biomes.ruins;
    this.cols = Math.ceil(world.pixelW() / CH);
    this.rows = Math.ceil(world.pixelH() / CH);
    this.chunks = {};
    this.order = [];
    this.rng = G.RNG(world.seed ^ 0x9e37);
  }

  Terrain.prototype.key = function (cx, cy) { return cx + ',' + cy; };

  Terrain.prototype.evict = function () {
    while (this.order.length > MAX_CHUNKS) {
      var k = this.order.shift();
      delete this.chunks[k];
    }
  };

  Terrain.prototype.get = function (cx, cy) {
    var k = this.key(cx, cy);
    var c = this.chunks[k];
    if (c) return c;
    c = this.bake(cx, cy);
    this.chunks[k] = c;
    this.order.push(k);
    this.evict();
    return c;
  };

  Terrain.prototype.invalidate = function () { this.chunks = {}; this.order.length = 0; };

  /* --- one tile of rock, drawn with fake autotiling ---------------------- */
  Terrain.prototype.tileRock = function (ctx, w, tx, ty, ox, oy) {
    var t = K.TILE, p = this.bio.rock;
    var x = tx * t - ox, y = ty * t - oy;
    var n = M.hash2(tx, ty);

    // body: subtle per-tile value variation so large walls aren't flat
    ctx.fillStyle = n < 0.33 ? p.d : (n < 0.72 ? p.m : p.l);
    ctx.fillRect(x, y, t, t);

    // interior noise blocks
    var n2 = M.hash2(tx * 3.1, ty * 2.7);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.05 + n2 * 0.10).toFixed(3) + ')';
    ctx.fillRect(x + (n2 * t * 0.5 | 0), y + (n * t * 0.5 | 0), t * 0.4, t * 0.35);

    var up = !w.isSolid(tx, ty - 1);
    var dn = !w.isSolid(tx, ty + 1);
    var lf = !w.isSolid(tx - 1, ty);
    var rt = !w.isSolid(tx + 1, ty);

    // lit top face
    if (up) {
      var g = ctx.createLinearGradient(0, y, 0, y + t * 0.6);
      g.addColorStop(0, p.edge);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, t, t * 0.6);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(x, y, t, 2);
      // chipped silhouette on the top edge
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      if (n < 0.3) ctx.fillRect(x, y, t * 0.34, 3);
      if (n > 0.7) ctx.fillRect(x + t * 0.62, y, t * 0.38, 2);
      // moss / lichen
      if (n2 > 0.62) {
        ctx.fillStyle = p.moss;
        ctx.fillRect(x + n * t * 0.4, y + 1, t * (0.3 + n2 * 0.4), 3 + n2 * 3);
      }
    }
    // ambient occlusion on inner edges
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    if (dn) ctx.fillRect(x, y + t - 3, t, 3);
    if (lf) ctx.fillRect(x, y, 2, t);
    if (rt) ctx.fillRect(x + t - 2, y, 2, t);

    // mortar lines
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    if (ty % 2 === 0) ctx.fillRect(x + (n > 0.5 ? t * 0.5 : 0) | 0, y, 1, t);
    ctx.fillRect(x, y + t - 1, t, 1);

    // cracks
    if (n2 < 0.09) {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + n * t, y + 2);
      ctx.lineTo(x + n * t + (n2 - 0.05) * 60, y + t - 2);
      ctx.stroke();
    }
  };

  Terrain.prototype.tilePlat = function (ctx, tx, ty, ox, oy) {
    var t = K.TILE, p = this.bio.rock;
    var x = tx * t - ox, y = ty * t - oy;
    var n = M.hash2(tx, ty * 1.7);
    var h = 8;
    ctx.fillStyle = p.m;
    ctx.fillRect(x, y, t, h);
    ctx.fillStyle = p.edge;
    ctx.fillRect(x, y, t, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, t, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, y + h - 2, t, 2);
    // hanging bracket detail
    if (n > 0.66) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x + t * 0.42, y + h, 3, 5 + n * 5);
    }
  };

  Terrain.prototype.tileSpike = function (ctx, tx, ty, ox, oy, w) {
    var t = K.TILE;
    var x = tx * t - ox, y = ty * t - oy;
    var upright = !w.isSolid(tx, ty + 1) && w.isSolid(tx, ty - 1);
    ctx.save();
    if (upright) { ctx.translate(x + t / 2, y + t / 2); ctx.rotate(Math.PI); ctx.translate(-t / 2, -t / 2); }
    else ctx.translate(x, y);
    // base plate
    ctx.fillStyle = '#241f26';
    ctx.fillRect(0, t - 5, t, 5);
    for (var i = 0; i < 3; i++) {
      var bx = 2 + i * (t - 4) / 3;
      var bw = (t - 4) / 3 - 1;
      var g = ctx.createLinearGradient(0, t - 5, 0, 2);
      g.addColorStop(0, '#6b6472');
      g.addColorStop(0.6, '#9aa0ae');
      g.addColorStop(1, '#e6ecf5');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx, t - 4);
      ctx.lineTo(bx + bw / 2, 1);
      ctx.lineTo(bx + bw, t - 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.moveTo(bx + bw / 2, 1);
      ctx.lineTo(bx + bw, t - 4);
      ctx.lineTo(bx + bw / 2, t - 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  };

  Terrain.prototype.bake = function (cx, cy) {
    var w = this.world, t = K.TILE;
    var cv = document.createElement('canvas');
    cv.width = CH; cv.height = CH;
    var ctx = cv.getContext('2d');
    var ox = cx * CH, oy = cy * CH;
    var tx0 = Math.floor(ox / t), tx1 = Math.ceil((ox + CH) / t);
    var ty0 = Math.floor(oy / t), ty1 = Math.ceil((oy + CH) / t);

    for (var ty = ty0; ty <= ty1; ty++) {
      for (var tx = tx0; tx <= tx1; tx++) {
        if (!w.inBounds(tx, ty)) continue;
        var v = w.grid[w.idx(tx, ty)];
        if (v === T.SOLID) {
          // gate columns are drawn dynamically, never baked
          if (this.isGateTile(tx, ty)) continue;
          this.tileRock(ctx, w, tx, ty, ox, oy);
        } else if (v === T.PLAT) {
          this.tilePlat(ctx, tx, ty, ox, oy);
        } else if (v === T.SPIKE) {
          this.tileSpike(ctx, tx, ty, ox, oy, w);
        }
        // CRUMBLE is dynamic (it can vanish) — drawn in the live pass
      }
    }

    // baked decals sitting on exposed tops
    for (var i = 0; i < w.decals.length; i++) {
      var d = w.decals[i];
      if (d.x < tx0 - 1 || d.x > tx1 + 1 || d.y < ty0 - 1 || d.y > ty1 + 1) continue;
      var x = d.x * t - ox, y = d.y * t - oy;
      ctx.save();
      if (d.k === 0) {          // rubble pile
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(x + 2, y - 3, 6 + d.r * 8, 3);
        ctx.fillStyle = this.bio.rock.l;
        ctx.fillRect(x + 3, y - 5, 4 + d.r * 5, 3);
      } else if (d.k === 1) {   // tufts of dead grass
        ctx.strokeStyle = 'rgba(120,120,90,0.35)';
        ctx.lineWidth = 1;
        for (var s = 0; s < 4; s++) {
          ctx.beginPath();
          ctx.moveTo(x + 4 + s * 4, y);
          ctx.lineTo(x + 4 + s * 4 + (d.r - 0.5) * 8, y - 5 - d.r * 6);
          ctx.stroke();
        }
      } else if (d.k === 2) {   // broken pillar stub
        ctx.fillStyle = this.bio.rock.m;
        ctx.fillRect(x + 5, y - 12 - d.r * 10, 12, 12 + d.r * 10);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(x + 5, y - 12 - d.r * 10, 3, 12 + d.r * 10);
      } else {                  // chain hanging from above
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + t * 0.5, y);
        ctx.lineTo(x + t * 0.5 + (d.r - 0.5) * 6, y - 20 - d.r * 26);
        ctx.stroke();
      }
      ctx.restore();
    }
    return cv;
  };

  Terrain.prototype.isGateTile = function (tx, ty) {
    var gs = this.world.gates;
    for (var i = 0; i < gs.length; i++) {
      var g = gs[i];
      if (g.tx === tx && ty >= g.ty && ty < g.ty + g.th) return true;
    }
    return false;
  };

  Terrain.prototype.draw = function (ctx, cam) {
    var ox = cam.ox(), oy = cam.oy();
    var vw = cam.vw / cam.zoom, vh = cam.vh / cam.zoom;
    var c0 = Math.max(0, Math.floor(ox / CH)), c1 = Math.min(this.cols - 1, Math.floor((ox + vw) / CH));
    var r0 = Math.max(0, Math.floor(oy / CH)), r1 = Math.min(this.rows - 1, Math.floor((oy + vh) / CH));
    for (var cy = r0; cy <= r1; cy++) {
      for (var cx = c0; cx <= c1; cx++) {
        var cv = this.get(cx, cy);
        ctx.drawImage(cv, Math.round(cx * CH - ox), Math.round(cy * CH - oy));
      }
    }
  };

  /* Dynamic terrain layer: crumble tiles, gates, movers, saws. */
  Terrain.prototype.drawDynamic = function (ctx, cam, time) {
    var w = this.world, t = K.TILE, p = this.bio.rock;
    var ox = cam.ox(), oy = cam.oy();
    var vw = cam.vw / cam.zoom, vh = cam.vh / cam.zoom;
    var tx0 = Math.max(0, Math.floor(ox / t) - 1), tx1 = Math.min(w.w - 1, Math.floor((ox + vw) / t) + 1);
    var ty0 = Math.max(0, Math.floor(oy / t) - 1), ty1 = Math.min(w.h - 1, Math.floor((oy + vh) / t) + 1);

    /* crumbling tiles */
    for (var ty = ty0; ty <= ty1; ty++) {
      for (var tx = tx0; tx <= tx1; tx++) {
        if (w.grid[w.idx(tx, ty)] !== T.CRUMBLE) continue;
        var st = w.crumbleState[tx + ',' + ty];
        if (st && st.gone) continue;
        var shake = st && st.t > 0 ? (Math.random() - 0.5) * 2.4 : 0;
        var x = tx * t - ox + shake, y = ty * t - oy + shake;
        ctx.save();
        ctx.globalAlpha = st && st.t > 0 ? 0.6 + Math.sin(time * 40) * 0.25 : 1;
        ctx.fillStyle = p.m;
        ctx.fillRect(x, y, t, t);
        ctx.fillStyle = p.edge;
        ctx.fillRect(x, y, t, 2);
        // fracture lines make it read as breakable
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 3, y); ctx.lineTo(x + t * 0.45, y + t * 0.55); ctx.lineTo(x + 2, y + t);
        ctx.moveTo(x + t - 3, y); ctx.lineTo(x + t * 0.6, y + t * 0.5); ctx.lineTo(x + t, y + t - 4);
        ctx.stroke();
        ctx.restore();
      }
    }

    /* arena gates — portcullis sliding down */
    for (var gi = 0; gi < w.gates.length; gi++) {
      var g = w.gates[gi];
      if (g.anim <= 0.001) continue;
      var gx = g.tx * t - ox;
      var full = g.th * t;

G.Post = (function () {
  var grainCv = null;

  function buildGrain() {
    grainCv = document.createElement('canvas');
    grainCv.width = 128; grainCv.height = 128;
    var c = grainCv.getContext('2d');
    var img = c.createImageData(128, 128);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = 118 + Math.random() * 30;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 26;
    }
    c.putImageData(img, 0, 0);
  }

  return {
    apply: function (ctx, vw, vh, opts) {
      opts = opts || {};
      var flash = opts.flash, quality = opts.quality || 'med';

      // fog / depth wash
      if (opts.fog) {
        ctx.save();
        ctx.globalAlpha = 0.20;
        ctx.fillStyle = opts.fog;
        ctx.fillRect(0, 0, vw, vh);
        ctx.restore();
      }

      // vignette
      ctx.save();
      var vg = ctx.createRadialGradient(vw * 0.5, vh * 0.5, Math.min(vw, vh) * 0.34,
                                        vw * 0.5, vh * 0.5, Math.max(vw, vh) * 0.78);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.62)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, vw, vh);
      ctx.restore();

      // low-health / hurt pulse
      if (flash && flash.hurtPulse > 0.01) {
        ctx.save();
        var hp = flash.hurtPulse;
        var hg = ctx.createRadialGradient(vw * 0.5, vh * 0.5, Math.min(vw, vh) * 0.22,
                                          vw * 0.5, vh * 0.5, Math.max(vw, vh) * 0.62);
        hg.addColorStop(0, 'rgba(160,0,20,0)');
        hg.addColorStop(1, 'rgba(160,0,20,' + (hp * 0.55).toFixed(3) + ')');
        ctx.fillStyle = hg;
        ctx.fillRect(0, 0, vw, vh);
        ctx.restore();
      }
      if (opts.lowHealth > 0.01) {
        ctx.save();
        var lg = ctx.createRadialGradient(vw * 0.5, vh * 0.5, Math.min(vw, vh) * 0.26,
                                          vw * 0.5, vh * 0.5, Math.max(vw, vh) * 0.66);
        lg.addColorStop(0, 'rgba(120,0,16,0)');
        lg.addColorStop(1, 'rgba(120,0,16,' + (opts.lowHealth * 0.5).toFixed(3) + ')');
        ctx.fillStyle = lg;
        ctx.fillRect(0, 0, vw, vh);
        ctx.restore();
      }

      // impact flash
      if (flash && flash.a > 0.002) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(0.9, flash.a);
        ctx.fillStyle = flash.col;
        ctx.fillRect(0, 0, vw, vh);
        ctx.restore();
      }

      // film grain
      if (quality !== 'low') {
        if (!grainCv) buildGrain();
        ctx.save();
        ctx.globalAlpha = 0.055;
        ctx.globalCompositeOperation = 'overlay';
        var gx = -(Math.random() * 128 | 0), gy = -(Math.random() * 128 | 0);
        for (var y = gy; y < vh; y += 128)
          for (var x = gx; x < vw; x += 128)
            ctx.drawImage(grainCv, x, y);
        ctx.restore();
      }

      // letterbox scanline softening for a slightly filmic look
      if (quality === 'high') {
        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = '#000';
        for (var sy = 0; sy < vh; sy += 3) ctx.fillRect(0, sy, vw, 1);
        ctx.restore();
      }
    }
  };
})();

  count: function () { return G.LEVELS.length; },

  /* Turn an authored level into a live G.World. */
  world: function (i) {
    var d = this.get(i);
    return new G.World({
      name: d.name, biome: d.biome, w: d.w, h: d.h, seed: d.seed, build: d.build
    });

  /* Static sanity pass used by the smoke test: catches typos that would
     otherwise show up as an unreachable exit or a player spawning in rock. */
  validate: function () {
    var problems = [];
    for (var i = 0; i < G.LEVELS.length; i++) {
      var d = G.LEVELS[i];
      var w;
      try { w = this.world(i); }
      catch (e) { problems.push('L' + d.id + ' build threw: ' + e.message); continue; }
      var K = G.K, T = G.T;

      function solidAt(tx, ty) { return w.at(tx, ty) === T.SOLID; }
      function freeBody(tx, ty) {
        // 1x2 tile clearance for a standing actor whose feet are at row ty
        return !solidAt(tx, ty - 1) && !solidAt(tx, ty - 2);
      }
      function grounded(tx, ty) { return solidAt(tx, ty) || w.at(tx, ty) === T.PLAT; }

      if (!d.spawn) problems.push('L' + d.id + ' has no spawn');
      else {
        if (!freeBody(d.spawn[0], d.spawn[1])) problems.push('L' + d.id + ' spawn is inside geometry at ' + d.spawn);
        if (!grounded(d.spawn[0], d.spawn[1])) problems.push('L' + d.id + ' spawn has no floor at ' + d.spawn);
      }
      if (!d.exit) problems.push('L' + d.id + ' has no exit');
      else if (!freeBody(d.exit[0], d.exit[1])) problems.push('L' + d.id + ' exit is inside geometry at ' + d.exit);

      var lists = [['enemies', d.enemies], ['pickups', d.pickups]];
      for (var li = 0; li < lists.length; li++) {
        var arr = lists[li][1] || [];
        for (var j = 0; j < arr.length; j++) {
          var e = arr[j];
          if (e.x < 1 || e.x >= d.w - 1 || e.y < 1 || e.y >= d.h) {
            problems.push('L' + d.id + ' ' + lists[li][0] + '[' + j + '] out of bounds (' + e.x + ',' + e.y + ')');
          } else if (!freeBody(e.x, e.y)) {
            problems.push('L' + d.id + ' ' + lists[li][0] + '[' + j + '] embedded in rock (' + e.x + ',' + e.y + ')');
          }
        }
      }
      if (d.checkpoints) {
        for (var c = 0; c < d.checkpoints.length; c++) {
          var cp = d.checkpoints[c];
          if (!freeBody(cp[0], cp[1])) problems.push('L' + d.id + ' checkpoint[' + c + '] embedded (' + cp + ')');

      if (d.relic && !freeBody(d.relic.x, d.relic.y)) problems.push('L' + d.id + ' relic embedded');
      if (d.boss) {

        g.addColorStop(0.15, 'rgba(224,182,74,0.20)');
        g.addColorStop(0.85, 'rgba(224,182,74,0.20)');
        g.addColorStop(1, 'rgba(224,182,74,0.02)');
        ctx.fillStyle = g;
        ctx.fillRect(x, ry, w, rowH);
        ctx.fillStyle = C.gold;
        ctx.fillRect(x, ry, 3, rowH);
        ctx.restore();
      }
      txt(ctx, it.label, x + 22, ry + rowH * 0.5 + 6, {
        size: o.size || 19,
        col: dis ? C.faint : (sel ? '#fff8e6' : C.dim),
        weight: sel ? '700' : '600',
        glow: sel && !dis ? 'rgba(224,182,74,0.6)' : null
      });
      if (it.right) {
        txt(ctx, it.right, x + w - 22, ry + rowH * 0.5 + 6, {
          size: (o.size || 19) - 2, align: 'right',
          col: dis ? C.faint : (sel ? C.gold : C.dim)
        });
      }
      if (sel && !dis) {
        txt(ctx, '▸', x + 8, ry + rowH * 0.5 + 6, { size: 16, col: C.gold });
      }
    }
    return y + this.items.length * (rowH + gap);
  };

  /* ------------------------------------------------------------- touch --- */
  /* User-customisable screen layout. Positions/sizes are persisted as viewport
     fractions, so the arrangement survives rotation and different phones. */
  var DEFAULT_TOUCH = {
    left:   { x: 0.055, y: 0.765, w: 0.105, h: 0.155 },
    right:  { x: 0.170, y: 0.765, w: 0.105, h: 0.155 },
    attack: { x: 0.895, y: 0.770, w: 0.090, h: 0.135, col: '#c4283c' },
    jump:   { x: 0.775, y: 0.735, w: 0.090, h: 0.135, col: '#4e8ad8' },
    dash:   { x: 0.895, y: 0.615, w: 0.090, h: 0.135, col: '#4ec8a8' },
    block:  { x: 0.775, y: 0.555, w: 0.090, h: 0.135, col: '#c8a24e' },
    potion: { x: 0.925, y: 0.465, w: 0.065, h: 0.100, col: '#4ec87a' },
    pause:  { x: 0.930, y: 0.045, w: 0.055, h: 0.085 }
  };

  var DEFAULT_HUD = {
    health: { x: 0.018, y: 0.028, w: 0.300, h: 0.115 },
    xp:     { x: 0.785, y: 0.028, w: 0.195, h: 0.085 },
    boss:   { x: 0.280, y: 0.120, w: 0.440, h: 0.100 }
  };

  var LAYOUT_META = [
    { id: 'left',   label: 'MOVE LEFT', group: 'touch', icon: '◀' },
    { id: 'right',  label: 'MOVE RIGHT', group: 'touch', icon: '▶' },
    { id: 'jump',   label: 'JUMP', group: 'touch', icon: 'JMP' },
    { id: 'attack', label: 'ATTACK', group: 'touch', icon: 'ATK' },
    { id: 'dash',   label: 'DASH', group: 'touch', icon: 'DSH' },
    { id: 'block',  label: 'GUARD', group: 'touch', icon: 'GRD' },
    { id: 'potion', label: 'POTION', group: 'touch', icon: '+' },
    { id: 'pause',  label: 'PAUSE', group: 'touch', icon: '‖' },
    { id: 'health', label: 'HEALTH BAR', group: 'hud' },
    { id: 'xp',     label: 'LEVEL / XP', group: 'hud' },
    { id: 'boss',   label: 'BOSS BAR', group: 'hud' }
  ];

  function cloneLayout(src) {
    var out = { touch: {}, hud: {} };
    var groups = ['touch', 'hud'];
    for (var gi = 0; gi < groups.length; gi++) {
      var gname = groups[gi], base = gname === 'touch' ? DEFAULT_TOUCH : DEFAULT_HUD;
      for (var k in base) {
        var v = (src && src[gname] && src[gname][k]) || base[k];
        out[gname][k] = { x: v.x, y: v.y, w: v.w, h: v.h };
      }
    }
    return out;
  }

  function getLayout(g) {
    if (!g || !g.save) return cloneLayout(null);
    if (!g.save.settings.layout) g.save.settings.layout = cloneLayout(null);
    return g.save.settings.layout;
  }

  function clampLayoutItem(v) {
    v.w = M.clamp(v.w, 0.035, 0.45);
    v.h = M.clamp(v.h, 0.035, 0.35);
    v.x = M.clamp(v.x, 0.005, 0.995 - v.w);
    v.y = M.clamp(v.y, 0.005, 0.995 - v.h);
  }

  function touchLayout(vw, vh, settings) {
    var layout = settings && settings.layout ? settings.layout : null;
    var base = cloneLayout(layout);
    var acts = {
      left:   { icon: '◀' }, right: { icon: '▶' }, jump: { icon: 'JMP', col: '#4e8ad8' },
      attack: { icon: 'ATK', col: '#c4283c' }, dash: { icon: 'DSH', col: '#4ec8a8' },
      block:  { icon: 'GRD', col: '#c8a24e' }, potion: { icon: '+', col: '#4ec87a' }, pause: { icon: '‖' }
    };
    var out = {};
    for (var k in acts) {
      var v = base.touch[k], m = acts[k];
      out[k] = {
        x: v.x * vw, y: v.y * vh, w: v.w * vw, h: v.h * vh,
        act: k, icon: m.icon, col: m.col
      };
    }
    return out;
  }

  var touchState = {};

  function drawTouch(ctx, vw, vh, g) {
    var L = touchLayout(vw, vh, g && g.save.settings);
    ctx.save();
    for (var k in L) {
      var b = L[k], on = !!touchState[b.act];
      var rr = Math.min(b.w, b.h) * 0.5;
      ctx.globalAlpha = on ? 0.70 : 0.30;
      ctx.fillStyle = b.col || '#d8d2c4';
      ctx.beginPath();
      ctx.ellipse(b.x + b.w * 0.5, b.y + b.h * 0.5, b.w * 0.5, b.h * 0.5, 0, 0, 6.2832);
      ctx.fill();
      ctx.globalAlpha = on ? 0.98 : 0.55;
      ctx.strokeStyle = '#0b0a10'; ctx.lineWidth = Math.max(1.5, Math.min(b.w, b.h) * 0.025); ctx.stroke();
      ctx.globalAlpha = on ? 1 : 0.78;
      txt(ctx, b.icon, b.x + b.w * 0.5, b.y + b.h * 0.5 + (b.icon.length > 1 ? Math.min(6, b.h * 0.12) : Math.min(7, b.h * 0.14)), {
        size: b.icon.length > 1 ? Math.min(b.w, b.h) * 0.25 : Math.min(b.w, b.h) * 0.38,
        align: 'center', col: '#0b0a10', weight: '800', stroke: false
      });
      // subtle highlight gives the controls a glassy, more game-like finish
      ctx.globalAlpha = on ? 0.22 : 0.10;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(b.x + b.w * 0.36, b.y + b.h * 0.28, b.w * 0.18, b.h * 0.11, -0.3, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function touchHit(vw, vh, px, py, settings) {
    var L = touchLayout(vw, vh, settings);
    for (var k in L) {
      var b = L[k], cx = b.x + b.w * 0.5, cy = b.y + b.h * 0.5;
      var rx = b.w * 0.62, ry = b.h * 0.62;
      if (((px - cx) / rx) * ((px - cx) / rx) + ((py - cy) / ry) * ((py - cy) / ry) <= 1) return b.act;
    }
    return null;
  }

  /* --------------------------------------------------------------- HUD --- */
  function drawHUD(ctx, g) {
    var vw = g.vw, vh = g.vh, p = g.player, s = g.save;
    var pad = 16;
    var lay = getLayout(g);

    /* --- health / stamina cluster --- */
    var hb = lay.hud.health;
    var hx = hb.x * vw, hy = hb.y * vh, bw = hb.w * vw, hh = hb.h * vh;
    var bh = M.clamp(hh * 0.27, 11, 22);
    panel(ctx, hx - 6, hy - 6, bw + 12, hh + 12, { r: 7 });

    var hpFrac = p.hp / p.maxHp;
    bar(ctx, hx, hy, bw, bh, hpFrac, C.hp, C.hpBack, { ghost: g.hpGhost, ghostCol: 'rgba(255,180,180,0.30)' });
    txt(ctx, Math.max(0, Math.ceil(p.hp)) + ' / ' + Math.round(p.maxHp), hx + bw - 4, hy + bh - 3,
      { size: Math.max(9, Math.min(13, bh * 0.72)), align: 'right', col: '#ffdede', weight: '700' });

    var stFrac = p.stam / p.maxStam;
    var sy = hy + bh + Math.max(4, hh * 0.08);
    bar(ctx, hx, sy, bw * 0.82, Math.max(7, bh * 0.60), stFrac, C.stam, C.stamBack);
    if (p.blockBreak > 0) {
      txt(ctx, 'GUARD BROKEN', hx + bw * 0.82 + 8, sy + Math.max(8, bh * 0.58),
        { size: 10, col: '#ff9a5a', weight: '800' });
    }

    /* potions */
    var py = sy + Math.max(16, bh * 1.35);
    for (var i = 0; i < s.maxPotions; i++) {
      var have = i < s.potions;
      ctx.save();
      ctx.globalAlpha = have ? 1 : 0.28;
      ctx.fillStyle = have ? '#4ec87a' : '#2a2a30';
      roundRect(ctx, pad + i * 16, py, 11, 15, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.5;
      roundRect(ctx, pad + i * 16, py, 11, 15, 3); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(pad + i * 16 + 2, py + 2, 3, 9);
      ctx.restore();
    }
    txt(ctx, 'L', pad + s.maxPotions * 16 + 6, py + 12, { size: 10, col: C.faint });

    /* --- level / xp --- */
    var xb = lay.hud.xp;
    var xx = xb.x * vw, xy = xb.y * vh, xw = xb.w * vw, xh = xb.h * vh;
    panel(ctx, xx - 8, xy - 6, xw + 16, xh + 12, { r: 7 });
    txt(ctx, 'LV ' + s.level, xx, xy + Math.max(14, xh * 0.34), { size: Math.max(13, Math.min(19, xh * 0.38)), col: C.gold, weight: '800' });
    var need = g.xpForLevel(s.level);
    var have2 = s.xp;
    txt(ctx, have2 + ' / ' + need, xx + xw, xy + Math.max(14, xh * 0.34), { size: 11, align: 'right', col: C.dim });
    bar(ctx, xx, xy + xh * 0.47, xw, Math.max(7, xh * 0.17), have2 / need, C.xp, '#16203a');
    txt(ctx, '◇ ' + s.gold, xx + xw, xy + xh * 0.90, { size: 12, align: 'right', col: C.gold, weight: '700' });

    /* --- ability readiness pips --- */
    var ax = pad, ay = vh - pad - 12;
    var pips = [
      { k: 'DASH', ready: p.dashCd <= 0, col: C.stam },
      { k: 'JUMP2', ready: true, col: '#9ab8ff' },
      { k: 'D-ATK', ready: s.abilities.dashAttack, col: '#ffb066', locked: !s.abilities.dashAttack },
      { k: 'PLUNGE', ready: s.abilities.plunge, col: '#ff8a5a', locked: !s.abilities.plunge }
    ];
    if (!G.Input.hasTouch()) {
      for (var pi = 0; pi < pips.length; pi++) {
        var pp = pips[pi];
        ctx.save();
        ctx.globalAlpha = pp.locked ? 0.20 : (pp.ready ? 0.92 : 0.35);
        ctx.fillStyle = pp.col;
        roundRect(ctx, ax, ay - 8, 46, 13, 3); ctx.fill();
        ctx.restore();
        txt(ctx, pp.k, ax + 23, ay + 2, { size: 8.5, align: 'center', col: '#0b0a10', weight: '800', stroke: false });
        ax += 52;
      }
    }

    /* --- level name / progress ribbon --- */
    txt(ctx, g.level.name.toUpperCase(), vw * 0.5, vh - pad + 2,
      { size: 12, align: 'center', col: C.faint, weight: '700' });

    /* --- combo counter --- */
    if (g.comboCount > 1 && g.comboTimer > 0) {
      var ck = M.clamp(g.comboTimer / 2.2, 0, 1);
      var cs = 30 + Math.min(24, g.comboCount * 1.6);
      txt(ctx, g.comboCount + '', vw - pad - 30, vh * 0.34, {
        size: cs, align: 'right', col: '#ffdf8a', weight: '800',
        alpha: 0.35 + ck * 0.65, glow: 'rgba(255,180,60,0.7)'
      });
      txt(ctx, 'HITS', vw - pad - 30, vh * 0.34 + 16, {
        size: 11, align: 'right', col: C.gold, weight: '700', alpha: 0.35 + ck * 0.65
      });
    }

    /* --- low health warning --- */
    if (hpFrac < 0.25 && !p.dead) {
      var pulse = 0.35 + Math.abs(Math.sin(g.time * 4)) * 0.4;
      txt(ctx, 'CRITICAL', pad + 4, pad + 62, { size: 12, col: '#ff5a5a', weight: '800', alpha: pulse });
    }

    /* --- boss bar --- */
    if (g.boss && !g.bossHidden) drawBossBar(ctx, g, g.boss);

    /* --- contextual tip --- */
    if (g.tipText && g.tipAlpha > 0.01) {
      var tw = ctx.measureText ? 0 : 0;
      ctx.save();
      ctx.font = '600 15px ' + FONT;
      tw = ctx.measureText(g.tipText).width;
      ctx.restore();
      var bx = vw * 0.5 - tw * 0.5 - 18;
      ctx.save();
      ctx.globalAlpha = g.tipAlpha;
      panel(ctx, bx, vh * 0.74, tw + 36, 38, { r: 5 });
      txt(ctx, g.tipText, vw * 0.5, vh * 0.74 + 24, { size: 15, align: 'center', col: C.ink });
      ctx.restore();
    }

    /* --- interaction prompt --- */
    if (g.prompt) {
      txt(ctx, g.prompt, vw * 0.5, vh * 0.66, {
        size: 14, align: 'center', col: C.gold, weight: '700',
        alpha: 0.6 + Math.sin(g.time * 5) * 0.3
      });
    }

    if (G.Input.hasTouch() && s.settings.showTouch !== false) drawTouch(ctx, vw, vh, g);
  }

  function drawBossBar(ctx, g, boss) {
    var vw = g.vw, vh = g.vh;
    var bb = getLayout(g).hud.boss;
    var x = bb.x * vw, y = bb.y * vh, w = bb.w * vw, h = M.clamp(bb.h * vh * 0.28, 8, 20);
    var frac = M.clamp(boss.hp / boss.maxHp, 0, 1);

    txt(ctx, boss.def.name, vw * 0.5, y - 12,
      { size: 16, align: 'center', col: '#f2e4c8', weight: '800', serif: true, glow: 'rgba(0,0,0,0.9)' });
    txt(ctx, boss.def.title, vw * 0.5, y + h + 16,
      { size: 10.5, align: 'center', col: C.faint, weight: '600' });

    ctx.save();
    ctx.fillStyle = 'rgba(6,5,9,0.8)';
    roundRect(ctx, x - 4, y - 4, w + 8, h + 8, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(224,182,74,0.45)'; ctx.lineWidth = 1.5;
    roundRect(ctx, x - 4, y - 4, w + 8, h + 8, 4); ctx.stroke();
    ctx.restore();

    bar(ctx, x, y, w, h, frac, '#9e1f2e', '#25090e',
      { ghost: g.bossGhost, ghostCol: 'rgba(255,200,160,0.35)', top: 'rgba(255,170,140,0.45)' });

    // phase division ticks
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 2;
    for (var i = 1; i < boss.def.phaseAt.length; i++) {
      var px = x + w * boss.def.phaseAt[i];
      ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, y + h); ctx.stroke();
    }
    ctx.restore();

    if (boss.transition > 0) {
      txt(ctx, 'PHASE ' + boss.phase, vw * 0.5, y + h * 0.5 + 5, {
        size: 11, align: 'center', col: '#ffe6a8', weight: '800',
        alpha: 0.5 + Math.abs(Math.sin(g.time * 8)) * 0.5
      });
    }
  }

  /* ------------------------------------------------------ title screen --- */
  function drawTitleArt(ctx, vw, vh, t) {
    // procedural crest: a cracked crown over a broken blade
    var cx = vw * 0.5, cy = vh * 0.235;
    ctx.save();
    ctx.translate(cx, cy);
    var s = Math.min(vw, vh) / 620;
    ctx.scale(s, s);

    // glow behind
    ctx.globalCompositeOperation = 'lighter';
    var gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 200);
    gg.addColorStop(0, 'rgba(224,182,74,0.22)');
    gg.addColorStop(1, 'rgba(224,182,74,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, 200, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // blade
    ctx.fillStyle = '#3b3a44';
    ctx.beginPath();
    ctx.moveTo(-9, 20); ctx.lineTo(9, 20); ctx.lineTo(7, 150); ctx.lineTo(0, 168); ctx.lineTo(-7, 150);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6d6b7a';
    ctx.beginPath();
    ctx.moveTo(-9, 20); ctx.lineTo(0, 20); ctx.lineTo(0, 168); ctx.lineTo(-7, 150);
    ctx.closePath(); ctx.fill();
    // fracture
    ctx.strokeStyle = '#14121a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-9, 96); ctx.lineTo(4, 104); ctx.lineTo(-6, 112); ctx.stroke();
    // guard
    ctx.fillStyle = '#8c7434';
    ctx.fillRect(-40, 10, 80, 11);
    ctx.fillStyle = '#c9a648';
    ctx.fillRect(-40, 10, 80, 4);

    // crown
    ctx.fillStyle = '#c9a648';
    ctx.beginPath();
    ctx.moveTo(-58, -6);
    ctx.lineTo(-58, -40); ctx.lineTo(-40, -18); ctx.lineTo(-20, -52);
    ctx.lineTo(0, -22); ctx.lineTo(20, -52); ctx.lineTo(40, -18);
    ctx.lineTo(58, -40); ctx.lineTo(58, -6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(-58, -14, 116, 8);
    ctx.fillStyle = '#f0d485';
    ctx.fillRect(-58, -6, 116, 3);
    // gems, pulsing
    var gems = [[-34, -20], [0, -26], [34, -20]];
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < gems.length; i++) {
      var pu = 0.6 + Math.sin(t * 2 + i * 1.7) * 0.35;
      var g2 = ctx.createRadialGradient(gems[i][0], gems[i][1], 0, gems[i][0], gems[i][1], 16);
      g2.addColorStop(0, 'rgba(255,90,60,' + (0.9 * pu).toFixed(2) + ')');
      g2.addColorStop(1, 'rgba(255,60,30,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(gems[i][0], gems[i][1], 16, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  /* --------------------------------------------------------- upgrades --- */
  function drawEditorButton(ctx,x,y,w,h,label,action,g){
    var active = g.layoutEditor && g.layoutEditor.lastAction === action;
    panel(ctx,x,y,w,h,{r:6,fill:active?'rgba(224,182,74,0.24)':'rgba(35,30,42,0.92)',edge:active?C.gold:'rgba(224,182,74,0.35)'});
    txt(ctx,label,x+w/2,y+h*0.67,{size:10.5,align:'center',col:active?'#fff3c4':C.ink,weight:'800'});
  }

  function drawEditorHudPreview(ctx,g){
    var lay=getLayout(g), vw=g.vw, vh=g.vh;
    var hb=lay.hud.health, xb=lay.hud.xp, bb=lay.hud.boss;
    ctx.save(); ctx.globalAlpha=0.42;
    panel(ctx,hb.x*vw-6,hb.y*vh-6,hb.w*vw+12,hb.h*vh+12,{r:7});
    bar(ctx,hb.x*vw,hb.y*vh,hb.w*vw,Math.max(10,hb.h*vh*0.27),0.76,C.hp,C.hpBack);
    panel(ctx,xb.x*vw-6,xb.y*vh-6,xb.w*vw+12,xb.h*vh+12,{r:7});
    txt(ctx,'LV 7',xb.x*vw,xb.y*vh+18,{size:15,col:C.gold,weight:'800'});
    bar(ctx,xb.x*vw,xb.y*vh+25,xb.w*vw,7,0.58,C.xp,'#16203a');
    ctx.globalAlpha=0.28; ctx.fillStyle='#b43c3c'; ctx.fillRect(bb.x*vw,bb.y*vh,bb.w*vw,Math.max(8,bb.h*vh*0.28));
    ctx.restore();
  }

  var STAT_INFO = [
    { k: 'vitality', label: 'VITALITY', desc: '+22 max health per point', col: '#c4283c' },
    { k: 'power', label: 'POWER', desc: '+16% attack damage per point', col: '#e08a3c' },
    { k: 'speed', label: 'SWIFTNESS', desc: '+5.5% move & attack speed per point', col: '#4ec8a8' },
    { k: 'stamina', label: 'ENDURANCE', desc: '+18 max stamina, faster regen', col: '#4e9ad8' },
    { k: 'fortune', label: 'FORTUNE', desc: '+22% gold and drop chance per point', col: '#e0b64a' },
    { k: 'focus', label: 'FOCUS', desc: '+18% parry window and stagger damage', col: '#b48ad8' }
  ];

  return {
    C: C, FONT: FONT, FONT_D: FONT_D,
    txt: txt, panel: panel, bar: bar, roundRect: roundRect,
    Menu: Menu, STAT_INFO: STAT_INFO,
    drawHUD: drawHUD, drawBossBar: drawBossBar, drawTitleArt: drawTitleArt,
    drawTouch: drawTouch, touchHit: touchHit, touchLayout: touchLayout,
    touchState: touchState,
    DEFAULT_TOUCH: DEFAULT_TOUCH,
    DEFAULT_HUD: DEFAULT_HUD,
    LAYOUT_META: LAYOUT_META,
    cloneLayout: cloneLayout,
    getLayout: getLayout,
    clampLayoutItem: clampLayoutItem,
    touchLayout: touchLayout,
    touchHit: touchHit,

    layoutEditor: function (ctx, g) {
      var vw = g.vw, vh = g.vh, lay = getLayout(g);
      ctx.fillStyle = 'rgba(6,5,9,0.96)'; ctx.fillRect(0, 0, vw, vh);
      txt(ctx, 'CONTROL LAYOUT', vw * 0.5, Math.min(42, vh * 0.10), { size: Math.min(28, vw * 0.045), align: 'center', col: '#f4e9d2', weight: '800', serif: true });
      txt(ctx, 'Tap an item to select · drag to move · use the size controls below', vw * 0.5, Math.min(65, vh * 0.15), { size: 11.5, align: 'center', col: C.dim });

      // dim playfield and draw a representative HUD preview
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#1b1724'; ctx.fillRect(0, 0, vw, vh); ctx.restore();
      drawEditorHudPreview(ctx, g);

      var selected = g.layoutEditor && g.layoutEditor.selected || 'left';
      var meta = null;
      for (var mi = 0; mi < LAYOUT_META.length; mi++) if (LAYOUT_META[mi].id === selected) { meta = LAYOUT_META[mi]; break; }
      var all = [];

        ctx.save();
        ctx.globalAlpha = m.group === 'touch' ? 0.74 : 0.55;
        if (m.group === 'touch') {
          ctx.fillStyle = (m.id === 'attack' ? '#c4283c' : m.id === 'jump' ? '#4e8ad8' : m.id === 'dash' ? '#4ec8a8' : m.id === 'block' ? '#c8a24e' : '#d8d2c4');
          ctx.beginPath(); ctx.ellipse(px + pw/2, py + ph/2, pw/2, ph/2, 0, 0, 6.2832); ctx.fill();
          txt(ctx, m.icon, px + pw/2, py + ph/2 + (m.icon.length > 1 ? 5 : 6), { size: Math.max(10, Math.min(pw,ph)*0.25), align:'center', col:'#0b0a10', weight:'800', stroke:false });
        } else {
          ctx.fillStyle = isSel ? 'rgba(224,182,74,0.22)' : 'rgba(90,130,180,0.16)';

          ctx.strokeStyle = isSel ? C.gold : 'rgba(150,170,200,0.65)'; ctx.lineWidth = isSel ? 3 : 1.5; ctx.strokeRect(px,py,pw,ph);
          txt(ctx, m.label, px + pw/2, py + ph/2 + 5, { size: Math.max(9, Math.min(14, pw*0.06)), align:'center', col:'#fff3d0', weight:'800', stroke:false });
        }

          ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.setLineDash([5,4]); ctx.strokeRect(px-3,py-3,pw+6,ph+6); ctx.setLineDash([]);
        }
        ctx.restore();
      }

      var selV = lay[meta.group][meta.id];
      var toolbarH = Math.min(86, Math.max(74, vh * 0.16));
      var ty = vh - toolbarH - 10;
      panel(ctx, 10, ty, vw - 20, toolbarH, { r: 9, fill: 'rgba(10,9,15,0.94)' });
      txt(ctx, meta.label + '  ·  ' + meta.group.toUpperCase(), 24, ty + 22, { size: 13, col: C.gold, weight:'800' });
      txt(ctx, 'X ' + Math.round(selV.x*100) + '%   Y ' + Math.round(selV.y*100) + '%   W ' + Math.round(selV.w*100) + '%   H ' + Math.round(selV.h*100) + '%', 24, ty + 40, { size: 10.5, col:C.dim });
      drawEditorButton(ctx, 24, ty + 48, 66, 28, 'W −', 'wminus', g);
      drawEditorButton(ctx, 96, ty + 48, 66, 28, 'W +', 'wplus', g);
      drawEditorButton(ctx, 168, ty + 48, 66, 28, 'H −', 'hminus', g);
      drawEditorButton(ctx, 240, ty + 48, 66, 28, 'H +', 'hplus', g);
      drawEditorButton(ctx, vw - 174, ty + 48, 74, 28, 'RESET', 'reset', g);
      drawEditorButton(ctx, vw - 92, ty + 48, 68, 28, 'DONE', 'done', g);

    layoutEditorHit: function (g, px, py) {
      var vw=g.vw, vh=g.vh, lay=getLayout(g), meta=null;
      var selected = g.layoutEditor && g.layoutEditor.selected || 'left';
      for (var i=0;i<LAYOUT_META.length;i++) if (LAYOUT_META[i].id===selected) meta=LAYOUT_META[i];
      var toolbarH=Math.min(86,Math.max(74,vh*0.16)), ty=vh-toolbarH-10;
      var buttons=[
        {x:24,y:ty+48,w:66,h:28,a:'wminus'},{x:96,y:ty+48,w:66,h:28,a:'wplus'},
        {x:168,y:ty+48,w:66,h:28,a:'hminus'},{x:240,y:ty+48,w:66,h:28,a:'hplus'},
        {x:vw-174,y:ty+48,w:74,h:28,a:'reset'},{x:vw-92,y:ty+48,w:68,h:28,a:'done'}
      ];
      for(var bi=0;bi<buttons.length;bi++){var b=buttons[bi];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return {type:'button',action:b.a};}
      for(var ri=LAYOUT_META.length-1;ri>=0;ri--){var m=LAYOUT_META[ri],v=lay[m.group][m.id];if(px>=v.x*vw&&px<=v.x*vw+v.w*vw&&py>=v.y*vh&&py<=v.y*vh+v.h*vh)return {type:'item',id:m.id};}
      return null;

    title: function (ctx, g) {

        var y = vh - ((t * 22 + i * 61) % (vh + 120)) + 60;
        var a = 0.10 + (Math.sin(t * 2.3) * 0.5 + 0.5) * 0.4;
        ctx.save();

      drawTitleArt(ctx, vw, vh, g.time);

      txt(ctx, 'GRIMHOLLOW', vw * 0.5, vh * 0.475, {

    levelSelect: function (ctx, g) {
      var vw = g.vw, vh = g.vh, s = g.save;

        vw * 0.5, 84, { size: 12, align: 'center', col: C.dim });

      // node trail
      var n = G.LEVELS.length;
      var top = 116, avail = vh - top - 120;
      var rowH = Math.min(46, avail / n);
      var mw = Math.min(560, vw * 0.78);
      var mx = (vw - mw) * 0.5;

      g.menu.rects.length = 0;
      for (var i = 0; i < n; i++) {
        var L = G.LEVELS[i];
        var y = top + i * rowH;
        var unlocked = i <= s.unlockedLevel;
        var done = !!s.completed[i];
        var sel = g.menu.index === i;
        g.menu.rects.push({ x: mx, y: y, w: mw, h: rowH - 4 });

        if (sel) {
          ctx.save();
          var gr = ctx.createLinearGradient(mx, y, mx + mw, y);
          gr.addColorStop(0, 'rgba(224,182,74,0.02)');
          gr.addColorStop(0.5, 'rgba(224,182,74,0.16)');
          gr.addColorStop(1, 'rgba(224,182,74,0.02)');
          ctx.fillStyle = gr; ctx.fillRect(mx, y, mw, rowH - 4);
          ctx.restore();
        }
        // connector line + node
        var nx = mx + 26, ny = y + (rowH - 4) * 0.5;
        if (i > 0) {
          ctx.save();
          ctx.strokeStyle = unlocked ? 'rgba(224,182,74,0.4)' : 'rgba(95,89,79,0.25)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(nx, y - rowH * 0.5 + 2); ctx.lineTo(nx, ny - 9); ctx.stroke();
          ctx.restore();

        ctx.beginPath(); ctx.arc(nx, ny, 8, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = unlocked ? 'rgba(240,220,170,0.7)' : 'rgba(95,89,79,0.4)';

        if (L.boss) {

        }
        ctx.restore();

        var label = unlocked ? (i + 1) + '.  ' + L.name : (i + 1) + '.  ' + '—'.repeat(Math.min(16, L.name.length));
        txt(ctx, label, nx + 22, ny + 5, {

        });

      txt(ctx, 'ENTER  begin   ·   U  upgrades   ·   ESC  back',
        vw * 0.5, vh - 34, { size: 12, align: 'center', col: C.dim });
      if (G.LEVELS[g.menu.index] && G.LEVELS[g.menu.index].hint && g.menu.index <= s.unlockedLevel) {
        txt(ctx, '"' + G.LEVELS[g.menu.index].hint + '"', vw * 0.5, vh - 56,
          { size: 12.5, align: 'center', col: 'rgba(224,182,74,0.75)', weight: '500' });
