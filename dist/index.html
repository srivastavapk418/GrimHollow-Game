<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0810">
<meta name="description" content="Grimhollow — a dark action-platformer. Dash, combo, parry. Ten levels, three bosses.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Grimhollow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0810'/%3E%3Cpath d='M6 20 L10 9 L13 15 L16 7 L19 15 L22 9 L26 20 Z' fill='%23e0b64a'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #06050a; color: #e8e2d6;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  #game {
    display: block; position: absolute; top: 0; left: 0;
    image-rendering: auto;
    background: #06050a;
  }
  #boot {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #06050a; z-index: 10;
  }
  #boot h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(28px, 7vw, 60px); font-weight: 400;
    letter-spacing: 0.22em; color: #e0b64a; text-transform: uppercase;
    text-shadow: 0 0 30px rgba(224,182,74,0.35);
  }
  #boot p { font-size: 13px; letter-spacing: 0.16em; color: #6b6459; text-transform: uppercase; }
  #boot .spin {
    width: 30px; height: 30px; border: 2px solid rgba(224,182,74,0.18);
    border-top-color: #e0b64a; border-radius: 50%;
    animation: sp 0.9s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  #err {
    position: absolute; inset: 0; display: none; z-index: 20;
    background: #0d0a10; color: #ff9a8a; padding: 24px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; overflow: auto; line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="boot">
  <h1>Grimhollow</h1>
  <div class="spin"></div>
  <p>Press any key to begin</p>
</div>

<pre id="err"></pre>

<script>
/* Surface errors on screen — a black canvas with a silent console is the
   worst possible failure mode for someone just opening the file. */
(function () {
  function show(msg) {
    var e = document.getElementById('err');
    if (!e) return;
    e.style.display = 'block';
    e.textContent += msg + '\n\n';
    var b = document.getElementById('boot');
    if (b) b.style.display = 'none';
  }
  window.addEventListener('error', function (ev) {
    show('ERROR: ' + (ev.message || 'unknown') +
         '\n  at ' + (ev.filename || '?') + ':' + (ev.lineno || '?') + ':' + (ev.colno || '?') +
         (ev.error && ev.error.stack ? '\n\n' + ev.error.stack : ''));
  });
  window.addEventListener('unhandledrejection', function (ev) {
    show('UNHANDLED PROMISE: ' + (ev.reason && ev.reason.stack ? ev.reason.stack : ev.reason));
  });
})();
</script>

    if (!ready || muted || !musicOn) return;
    musicTimer -= dt;
    if (musicTimer > 0) return;
    var rate = RATE[musicMood] || 0.6;
    musicTimer = rate;
    var sc = SCALE[musicMood] || SCALE.calm;
    var root = ROOT[musicMood] || 110;
    musicStep++;
    var deg = sc[musicStep % sc.length];
    var oct = (musicStep % (sc.length * 2) < sc.length) ? 2 : 3;
    var f = root * Math.pow(2, deg / 12) * oct;
    tone({ type: 'triangle', f0: f, f1: f, dur: rate * 1.7, vol: 0.055, atk: 0.05, bus: 'music', filter: 'lowpass', fc: 2200 });
    // drone every 4 steps
    if (musicStep % 4 === 1) {
      tone({ type: 'sine', f0: root, f1: root, dur: rate * 4.2, vol: 0.075, atk: 0.35, bus: 'music' });
      tone({ type: 'sine', f0: root * 1.5, f1: root * 1.5, dur: rate * 4.0, vol: 0.035, atk: 0.4, bus: 'music' });
    }
    if (musicMood === 'boss' && musicStep % 2 === 0) {
      noise({ filter: 'lowpass', fc: 220, fc1: 90, dur: 0.22, vol: 0.16, bus: 'music' });
    }
  }

  return {
    unlock: function () {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
    },
    play: function (name, a) {
      if (!ensure() || muted) return;
      if (ctx.state === 'suspended') { ctx.resume(); }
      var f = SFX[name];
      if (f) { try { f(a); } catch (e) { /* audio must never break gameplay */ } }

})();

/* ---------------------------------------------------------------- save ---- */
/* localStorage, with an in-memory fallback so the game still runs when
   opened from file:// in a browser with storage disabled. */
G.Save = (function () {
  var KEY = 'grimhollow.save.v1';
  var mem = null, usable = true;
  try {
    var t = '__gh_probe__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
  } catch (e) { usable = false; }

  function blank() {
    return {
      unlockedLevel: 0,       // 0-based index of the furthest level you may enter
      completed: [],          // completed[levelIndex] = true
      xp: 0, level: 1, gold: 0,
      stats: { vitality: 0, power: 0, speed: 0, stamina: 0, fortune: 0, focus: 0 },
      // Double jump is baseline traversal, not a mid-campaign gate.  This
      // keeps every level recoverable on keyboard, gamepad, and touch.
      abilities: { doubleJump: true, airControl: false, dashAttack: false, plunge: false },
      potions: 3, maxPotions: 3,
      secrets: [],            // array of "levelId:index" strings
      totalDeaths: 0, totalTime: 0,
      settings: { muted: false, shake: 1, quality: 'med', showTouch: 'auto', cameraZoom: 1, layout: null }
    };
  }

  /* Coerce an arbitrary parsed blob onto the blank schema. A save that has
     been hand-edited, truncated, or written by an older build must never be
     able to crash the game — worst case we fall back to a fresh profile. */
  function coerce(d) {
    var b = blank();
    if (!d || typeof d !== 'object') return b;

    function num(v, def, lo, hi) {
      var n = typeof v === 'number' ? v : parseFloat(v);
      if (!isFinite(n)) return def;
      if (lo != null) n = Math.max(lo, n);
      if (hi != null) n = Math.min(hi, n);
      return n;
    }

    b.unlockedLevel = Math.floor(num(d.unlockedLevel, 0, 0, 999));
    b.xp            = Math.floor(num(d.xp, 0, 0));
    b.level         = Math.floor(num(d.level, 1, 1, 999));
    b.gold          = Math.floor(num(d.gold, 0, 0));
    b.potions       = Math.floor(num(d.potions, 3, 0, 99));
    b.maxPotions    = Math.floor(num(d.maxPotions, 3, 1, 99));
    b.totalDeaths   = Math.floor(num(d.totalDeaths, 0, 0));
    b.totalTime     = num(d.totalTime, 0, 0);

    // completed: accept an array or a legacy object keyed by index
    if (Array.isArray(d.completed)) {
      for (var i = 0; i < d.completed.length; i++) b.completed[i] = !!d.completed[i];
    } else if (d.completed && typeof d.completed === 'object') {
      for (var ck in d.completed) {
        var ci = parseInt(ck, 10);
        if (ci >= 0 && ci < 999) b.completed[ci] = !!d.completed[ck];
      }
    }

    // secrets: accept an array or a legacy object used as a set
    if (Array.isArray(d.secrets)) {
      for (var s = 0; s < d.secrets.length; s++) {
        var sv = '' + d.secrets[s];
        if (b.secrets.indexOf(sv) < 0) b.secrets.push(sv);
      }
    } else if (d.secrets && typeof d.secrets === 'object') {
      for (var sk in d.secrets) if (d.secrets[sk] && b.secrets.indexOf(sk) < 0) b.secrets.push(sk);
    }

    if (d.stats && typeof d.stats === 'object') {
      for (var st in b.stats) b.stats[st] = Math.floor(num(d.stats[st], 0, 0, 99));
    }
    if (d.abilities && typeof d.abilities === 'object') {
      for (var ab in b.abilities) b.abilities[ab] = !!d.abilities[ab];
      // a build before the rename stored the third relic as "parry"
      if (d.abilities.parry && !b.abilities.plunge) b.abilities.plunge = true;
    }
    // Migration for profiles created before double-jump became a permanent
    // movement ability.  Never lock an existing player out of a route.
    b.abilities.doubleJump = true;
    if (d.settings && typeof d.settings === 'object') {
      b.settings.muted = !!d.settings.muted;
      b.settings.shake = num(d.settings.shake, 1, 0, 2);
      b.settings.quality = (['low', 'med', 'high'].indexOf(d.settings.quality) >= 0)
        ? d.settings.quality : 'med';
      b.settings.showTouch = (['auto', 'on', 'off'].indexOf(d.settings.showTouch) >= 0)
        ? d.settings.showTouch : 'auto';
      b.settings.cameraZoom = num(d.settings.cameraZoom, 1, 0.75, 1.35);
      if (d.settings.layout && typeof d.settings.layout === 'object') {
        b.settings.layout = d.settings.layout;
      }
    }

    // A save can't claim more spent stat points than its level has earned.
    var spent = 0;
    for (var k2 in b.stats) spent += b.stats[k2];
    if (spent > b.level - 1) { for (var k3 in b.stats) b.stats[k3] = 0; }

    return b;
  }

  return {
    blank: blank,
    coerce: coerce,
    load: function () {
      try {
        var raw = usable ? window.localStorage.getItem(KEY) : mem;
        if (!raw) return blank();
        return coerce(JSON.parse(raw));
      } catch (e) { return blank(); }
    },
    _legacyLoad: function () {
      try {
        var raw = usable ? window.localStorage.getItem(KEY) : mem;
        if (!raw) return blank();
        return coerce(JSON.parse(raw));
      } catch (e) { return blank(); }
    },
    save: function (data) {
      try {
        var raw = JSON.stringify(data);
        if (usable) window.localStorage.setItem(KEY, raw); else mem = raw;
        return true;
      } catch (e) { mem = null; return false; }
    },
    wipe: function () {
      try { if (usable) window.localStorage.removeItem(KEY); else mem = null; } catch (e) {}
      return this.blank();
    },
    persistent: function () { return usable; }
  };
})();


/* ==== 02_world.js =================================================== */
/* ==========================================================================
   GRIMHOLLOW  —  02_world.js
   Tile grid, level compilation from the authoring DSL, swept AABB collision,
   moving/crumbling platforms, doors and arena gates.
   ========================================================================== */

var G = (typeof G !== 'undefined') ? G : {};

G.T = { EMPTY: 0, SOLID: 1, PLAT: 2, SPIKE: 3, VOID: 4, CRUMBLE: 5 };

G.World = (function () {
  var T = G.T, K = G.K;

  function World(def) {
    this.def = def;
    this.name = def.name;
    this.biome = def.biome || 'ruins';
    this.w = def.w;
    this.h = def.h;
    this.seed = def.seed || 1337;
    this.grid = new Uint8Array(this.w * this.h);
    this.crumbleState = {};        // "tx,ty" -> {t, gone}
    this.movers = [];              // moving platforms (solid AABBs)
    this.hazards = [];             // non-tile hazards (saw blades, etc.)
    this.decals = [];              // baked decoration hints
    this.torches = [];             // static light sources
    this.gates = [];               // arena doors that close behind you

  World.prototype.idx = function (tx, ty) { return ty * this.w + tx; };

    return tx >= 0 && ty >= 0 && tx < this.w && ty < this.h;
  };

  World.prototype.at = function (tx, ty) {
    if (tx < 0 || tx >= this.w) return T.SOLID;         // sealed side walls
    if (ty < 0) return T.EMPTY;                          // open sky
    if (ty >= this.h) return T.VOID;                     // bottomless pit
    return this.grid[ty * this.w + tx];

  World.prototype.set = function (tx, ty, v) {
    if (!this.inBounds(tx, ty)) return;
    this.grid[ty * this.w + tx] = v;
  };

  /* ------------------------------------------------------ DSL compiler --- */
  World.prototype.compile = function () {
    var b = this.def.build || [], i, j, x, y;
    for (i = 0; i < b.length; i++) {
      var op = b[i], kind = op[0];
      switch (kind) {
        case 'rect':   // solid block: x, y, w, h
          for (y = op[2]; y < op[2] + op[4]; y++)
            for (x = op[1]; x < op[1] + op[3]; x++) this.set(x, y, T.SOLID);
          break;
        case 'clear':  // carve empty: x, y, w, h
          for (y = op[2]; y < op[2] + op[4]; y++)
            for (x = op[1]; x < op[1] + op[3]; x++) this.set(x, y, T.EMPTY);
          break;
        case 'plat':   // one-way platform: x, y, w
          for (x = op[1]; x < op[1] + op[3]; x++) this.set(x, op[2], T.PLAT);
          break;
        case 'spike':  // floor spikes: x, y, w
          for (x = op[1]; x < op[1] + op[3]; x++) this.set(x, op[2], T.SPIKE);
          break;
        case 'crumble':
          for (x = op[1]; x < op[1] + op[3]; x++) this.set(x, op[2], T.CRUMBLE);
          break;
        case 'stair': { // staircase: x, y, steps, dir(+1 right/up), stepW
          var sw = op[5] || 2;
          for (j = 0; j < op[3]; j++) {
            var sx = op[1] + j * sw * (op[4] >= 0 ? 1 : -1);
            var sy = op[2] - j;
            for (var k2 = 0; k2 < sw; k2++)
              for (y = sy; y < this.h && y < sy + 40; y++) this.set(sx + k2 * (op[4] >= 0 ? 1 : -1), y, T.SOLID);
          }
          break;
        }
        case 'pillar': // decorative-but-solid column: x, y, h, w
          for (y = op[2]; y < op[2] + op[3]; y++)
            for (x = op[1]; x < op[1] + (op[4] || 1); x++) this.set(x, y, T.SOLID);
          break;
        case 'mover': { // moving platform: x, y, w, dx, dy, period
          this.movers.push({
            x0: op[1] * K.TILE, y0: op[2] * K.TILE,
            x: op[1] * K.TILE, y: op[2] * K.TILE,
            px: op[1] * K.TILE, py: op[2] * K.TILE,
            w: op[3] * K.TILE, h: Math.max(8, K.TILE * 0.5),
            dx: (op[4] || 0) * K.TILE, dy: (op[5] || 0) * K.TILE,
            period: op[6] || 4, t: op[7] || 0, vx: 0, vy: 0

          break;
        }
        case 'saw': { // sweeping blade hazard: x, y, dx, dy, period, r
          this.hazards.push({
            type: 'saw', x0: op[1] * K.TILE, y0: op[2] * K.TILE,
            x: op[1] * K.TILE, y: op[2] * K.TILE,
            dx: (op[3] || 0) * K.TILE, dy: (op[4] || 0) * K.TILE,
            period: op[5] || 3, t: 0, r: (op[6] || 0.9) * K.TILE, dmg: 24, spin: 0
          });
          break;
        }
        case 'torch':
          this.torches.push({ x: (op[1] + 0.5) * K.TILE, y: (op[2] + 0.5) * K.TILE, hue: op[3] || 28, flick: Math.random() * 6.28 });
          break;
        case 'gate': // arena gate: x, y, h  (closes when arena triggers)
          this.gates.push({ tx: op[1], ty: op[2], th: op[3], closed: false, anim: 0 });

  /* Decoration hints (cracks, moss, bricks) — deterministic from the seed so
     the baked terrain looks identical every run. */
  World.prototype.buildDecals = function () {
    var rng = G.RNG(this.seed);
    var n = Math.floor(this.w * this.h * 0.012);
    for (var i = 0; i < n; i++) {
      var tx = rng.int(0, this.w - 1), ty = rng.int(0, this.h - 1);
      if (this.at(tx, ty) !== T.SOLID) continue;
      if (this.at(tx, ty - 1) !== T.EMPTY) continue;   // only on exposed tops
      this.decals.push({ x: tx, y: ty, k: rng.int(0, 3), r: rng.next() });
    }
  };

  /* ------------------------------------------------------- tile queries --- */
  World.prototype.isSolid = function (tx, ty) {
    var v = this.at(tx, ty);
    return v === T.SOLID || (v === T.CRUMBLE && !this.crumbleGone(tx, ty));
  };
  World.prototype.isPlatform = function (tx, ty) { return this.at(tx, ty) === T.PLAT; };
  World.prototype.isHazardTile = function (tx, ty) {
    var v = this.at(tx, ty);
    return v === T.SPIKE || v === T.VOID;
  };
  World.prototype.crumbleGone = function (tx, ty) {
    var s = this.crumbleState[tx + ',' + ty];
    return !!(s && s.gone);
  };
  World.prototype.touchCrumble = function (tx, ty) {

  };

  /* Does an AABB (world px) overlap any solid tile? */
  World.prototype.rectSolid = function (x, y, w, h) {
    var t = K.TILE;
    var x0 = Math.floor(x / t), x1 = Math.floor((x + w - 0.001) / t);
    var y0 = Math.floor(y / t), y1 = Math.floor((y + h - 0.001) / t);

      for (var tx = x0; tx <= x1; tx++)

    return false;
  };

  /* Hazard overlap → returns damage amount or 0 */
  World.prototype.rectHazard = function (x, y, w, h) {
    var t = K.TILE, dmg = 0;
    var x0 = Math.floor(x / t), x1 = Math.floor((x + w - 0.001) / t);
    var y0 = Math.floor(y / t), y1 = Math.floor((y + h - 0.001) / t);
    for (var ty = y0; ty <= y1; ty++) {
      for (var tx = x0; tx <= x1; tx++) {
        var v = this.at(tx, ty);
        if (v === T.SPIKE) dmg = Math.max(dmg, 22);
        else if (v === T.VOID) dmg = Math.max(dmg, 9999);
      }
    }
    for (var i = 0; i < this.hazards.length; i++) {
      var hz = this.hazards[i];

    }
    return dmg;
  };

  /* Cheap line-of-sight for enemy AI: sample along the segment. */
  World.prototype.losClear = function (ax, ay, bx, by) {
    var d = G.M.dist(ax, ay, bx, by);
    var steps = Math.ceil(d / (K.TILE * 0.5));
    if (steps <= 0) return true;
    for (var i = 1; i < steps; i++) {
      var t = i / steps;
      var x = G.M.lerp(ax, bx, t), y = G.M.lerp(ay, by, t);

  };

  World.prototype.update = function (dt) {

      m.t += dt;

      m.x = m.x0 + m.dx * ph;
      m.y = m.y0 + m.dy * ph;
      m.vx = (m.x - m.px) / Math.max(dt, 1e-5);
      m.vy = (m.y - m.py) / Math.max(dt, 1e-5);

      var hz = this.hazards[i];
      hz.t += dt; hz.spin += dt * 9;
      var p = Math.sin((hz.t / hz.period) * Math.PI * 2) * 0.5 + 0.5;
      hz.x = hz.x0 + hz.dx * p;
      hz.y = hz.y0 + hz.dy * p;

      var s = this.crumbleState[k];
      if (!s.gone) {
        s.t -= dt;
        if (s.t <= 0) { s.gone = true; s.respawn = 3.2; }
      } else {
        s.respawn -= dt;
        if (s.respawn <= 0) delete this.crumbleState[k];

      g.anim = G.M.approach(g.anim, g.closed ? 1 : 0, dt * 2.2);

  };
  World.prototype.openGates = function () {
    for (var i = 0; i < this.gates.length; i++) this.gates[i].closed = false;
  };

  World.prototype.pixelH = function () { return this.h * K.TILE; };

})();

/* ==========================================================================
   Physics body — shared by player and every enemy.
   Per-axis swept movement against the tile grid plus moving platforms.
   ========================================================================== */
G.Body = (function () {
  var K = G.K, T = G.T;

  function Body(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0;
    this.onGround = false; this.wasOnGround = false;
    this.onWall = 0;              // -1 wall on left, +1 wall on right, 0 none
    this.onCeiling = false;
    this.ridingMover = null;
    this.gravityScale = 1;
    this.ignorePlatforms = 0;     // >0 = drop through one-way platforms
    this.landedHard = false;
  }

  Body.prototype.cx = function () { return this.x + this.w * 0.5; };
  Body.prototype.cy = function () { return this.y + this.h * 0.5; };
  Body.prototype.setCenter = function (cx, cy) { this.x = cx - this.w * 0.5; this.y = cy - this.h * 0.5; };

  /* Move with collision. Returns nothing; flags live on the body. */

    if (this.ignorePlatforms > 0) this.ignorePlatforms -= dt;

    /* --- carry by moving platform first (so the rider moves with it) --- */
    if (this.ridingMover) {
      m = this.ridingMover;
      this.x += (m.x - m.px);
      this.y += (m.y - m.py);

    /* ------------------------------------------------ horizontal sweep --- */
    var dx = this.vx * dt;

      var stepsX = Math.max(1, Math.ceil(Math.abs(dx) / (t * 0.4)));
      var sx = dx / stepsX;

          // snap flush against the wall
          var dir = G.M.sign(sx);
          if (dir > 0) this.x = Math.floor((this.x + this.w + sx) / t) * t - this.w - 0.01;
          else this.x = Math.floor((this.x + sx) / t) * t + t + 0.01;

    for (i = 0; i < world.movers.length; i++) {

      for (i = 0; i < stepsY; i++) {

          var pty = Math.floor(feetNext / t);
          for (var tx = tx0; tx <= tx1; tx++) {
            if (world.isPlatform(tx, pty) && feetNow <= pty * t + 1.5) { blocked = true; break; }
          }

            this.y = Math.floor((this.y + this.h + sy) / t) * t - this.h - 0.01;
            if (this.vy > 620) this.landedHard = true;
            this.onGround = true;

            var cty = Math.floor((this.y + this.h + 2) / t);
            var cx0 = Math.floor(this.x / t), cx1 = Math.floor((this.x + this.w - 0.001) / t);

            this.y = Math.floor((this.y + sy) / t) * t + t + 0.01;

G.Camera = (function () {
  function Camera(vw, vh) {
    this.x = 0; this.y = 0;             // top-left in world px
    this.vw = vw; this.vh = vh;

    this.y = cy - this.vh / (2 * this.zoom);

  };

  Camera.prototype.follow = function (target, dt, world, opts) {
    opts = opts || {};

    var desiredLook = G.M.clamp(target.body.vx * 0.30, -170, 170);
    this.lookahead = G.M.damp(this.lookahead, desiredLook, 3.0, dt);
    var lookDown = target.body.vy > 380 ? G.M.clamp((target.body.vy - 380) * 0.14, 0, 90) : 0;

    var cx = target.body.cx() + this.lookahead + (opts.offsetX || 0);
    var cy = target.body.cy() - 18 + lookDown + (opts.offsetY || 0);

    this.zoom = G.M.damp(this.zoom, this.zoomTarget, 4.0, dt);

    var tx = cx - this.vw / (2 * this.zoom);
    var ty = cy - this.vh / (2 * this.zoom);

    // Vertical is stiffer when grounded to avoid seasick bobbing on jumps.
    var lx = opts.lambdaX || 6.5;
    var ly = target.body.onGround ? 7.5 : 3.6;
    this.x = G.M.damp(this.x, tx, lx, dt);
    this.y = G.M.damp(this.y, ty, ly, dt);

    this.world = world;
    this.clamp();

    if (this.shake > 0.01) {
      this.shake = Math.max(0, this.shake - this.shakeDecay * this.shake * dt - 6 * dt);
      var mag = this.shake;
      this.shakeX = (Math.random() * 2 - 1) * mag;
      this.shakeY = (Math.random() * 2 - 1) * mag;
    } else { this.shake = 0; this.shakeX = 0; this.shakeY = 0; }
  };

  Camera.prototype.clamp = function () {
    var w = this.world;
    if (!w) return;
    var pw = w.pixelW(), ph = w.pixelH();
    var vwz = this.vw / this.zoom, vhz = this.vh / this.zoom;
    if (pw <= vwz) this.x = (pw - vwz) * 0.5;
    else this.x = G.M.clamp(this.x, 0, pw - vwz);
    if (ph <= vhz) this.y = (ph - vhz) * 0.5;
    else this.y = G.M.clamp(this.y, 0, ph - vhz);
  };

  Camera.prototype.ox = function () { return this.x - this.shakeX; };
  Camera.prototype.oy = function () { return this.y - this.shakeY; };

  Camera.prototype.visible = function (x, y, w, h, pad) {
    pad = pad || 64;
    var vwz = this.vw / this.zoom, vhz = this.vh / this.zoom;
    return x + w > this.x - pad && x < this.x + vwz + pad &&

})();

/* ==========================================================================
   GRIMHOLLOW  —  04_art.js
   Procedural character art. No sprite sheets: every actor is drawn from a

    ctx.moveTo(x + nx * w0 * 0.5, y + ny * w0 * 0.5);
    ctx.lineTo(ex + nx * w1 * 0.5, ey + ny * w1 * 0.5);
    ctx.arc(ex, ey, w1 * 0.5, Math.atan2(ny, nx), Math.atan2(-ny, -nx), true);
    ctx.lineTo(x - nx * w0 * 0.5, y - ny * w0 * 0.5);
    ctx.arc(x, y, w0 * 0.5, Math.atan2(-ny, -nx), Math.atan2(ny, nx), true);

      neck: o.neck == null ? 3 : o.neck,

      hipB: o.hipB || 0, knB: o.knB || 0,    // far leg

  /* --------------------------------------------------------- weapon art --- */
  function drawWeapon(ctx, rig, kind, hx, hy, a, glow) {
    var s = rig.scale;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-a);
    switch (kind) {
      case 'sword': {
        var L = 30 * s;
        // crossguard
        ctx.fillStyle = rig.accent;
        ctx.fillRect(-5.5 * s, -2.0 * s, 11 * s, 3.0 * s);
        // grip
        ctx.fillStyle = '#2a1d16';
        ctx.fillRect(-1.6 * s, 0, 3.2 * s, 7 * s);
        ctx.fillStyle = rig.accent;
        ctx.beginPath(); ctx.arc(0, 7.5 * s, 2.1 * s, 0, 6.2832); ctx.fill();
        // blade (tapered, with a bright edge highlight)
        var grad = ctx.createLinearGradient(-2.6 * s, 0, 2.6 * s, 0);
        grad.addColorStop(0, '#8e97a8'); grad.addColorStop(0.42, '#e8eef8');
        grad.addColorStop(0.6, '#c3ccdb'); grad.addColorStop(1, '#6d7688');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(-2.6 * s, -2.0 * s);
        ctx.lineTo(-1.5 * s, -L);
        ctx.lineTo(0, -L - 4.5 * s);
        ctx.lineTo(1.5 * s, -L);
        ctx.lineTo(2.6 * s, -2.0 * s);
        ctx.closePath(); ctx.fill();

          ctx.strokeStyle = 'rgba(180,225,255,' + (0.30 + glow * 0.55) + ')';
          ctx.lineWidth = 1.4 * s; ctx.stroke();

      }
      case 'greatsword': {
        var GL = 44 * s;
        ctx.fillStyle = rig.accent; ctx.fillRect(-8 * s, -2.4 * s, 16 * s, 3.6 * s);
        ctx.fillStyle = '#231a14'; ctx.fillRect(-2.2 * s, 0, 4.4 * s, 11 * s);
        var g2 = ctx.createLinearGradient(-4.6 * s, 0, 4.6 * s, 0);
        g2.addColorStop(0, '#6b7383'); g2.addColorStop(0.45, '#dfe6f2'); g2.addColorStop(1, '#575e6d');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(-4.6 * s, -2.4 * s); ctx.lineTo(-3.2 * s, -GL);
        ctx.lineTo(0, -GL - 7 * s); ctx.lineTo(3.2 * s, -GL);
        ctx.lineTo(4.6 * s, -2.4 * s); ctx.closePath(); ctx.fill();
        break;
      }
      case 'axe': {
        ctx.fillStyle = '#3a2a1c'; ctx.fillRect(-2.0 * s, -26 * s, 4.0 * s, 34 * s);
        ctx.fillStyle = '#8f97a4';
        ctx.beginPath();
        ctx.moveTo(1.6 * s, -26 * s); ctx.lineTo(15 * s, -22 * s);
        ctx.lineTo(17 * s, -13 * s); ctx.lineTo(1.6 * s, -12 * s);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#cfd6e2';
        ctx.beginPath();
        ctx.moveTo(13 * s, -22.5 * s); ctx.lineTo(15.5 * s, -21.5 * s);
        ctx.lineTo(17 * s, -13.4 * s); ctx.lineTo(14 * s, -12.6 * s);
        ctx.closePath(); ctx.fill();
        break;
      }
      case 'spear': {
        ctx.fillStyle = '#3a2a1c'; ctx.fillRect(-1.7 * s, -34 * s, 3.4 * s, 48 * s);
        ctx.fillStyle = '#d3dae6';
        ctx.beginPath();
        ctx.moveTo(0, -46 * s); ctx.lineTo(3.6 * s, -33 * s);
        ctx.lineTo(0, -29 * s); ctx.lineTo(-3.6 * s, -33 * s);
        ctx.closePath(); ctx.fill();
        break;

        ctx.strokeStyle = '#5a4028'; ctx.lineWidth = 2.6 * s;
        ctx.beginPath(); ctx.arc(0, 0, 13 * s, -1.25, 1.25); ctx.stroke();
        ctx.strokeStyle = 'rgba(230,230,230,0.75)'; ctx.lineWidth = 1 * s;

        ctx.lineTo(13 * s * Math.cos(1.25), 13 * s * Math.sin(1.25));

        var pg = ctx.createRadialGradient(0, -34 * s, 0, 0, -34 * s, 8 * s);
        pg.addColorStop(0, 'rgba(190,120,255,0.95)'); pg.addColorStop(1, 'rgba(120,60,220,0)');
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.arc(0, -34 * s, 8 * s, 0, 6.2832); ctx.fill();
        break;

        ctx.fillStyle = '#cfd6e2';
        for (var c = -1; c <= 1; c++) {
          ctx.beginPath();
          ctx.moveTo(c * 3.2 * s, 0);
          ctx.lineTo(c * 4.8 * s + 1.2 * s, -13 * s);
          ctx.lineTo(c * 3.2 * s - 1.0 * s, -11 * s);
          ctx.closePath(); ctx.fill();
        }
        break;
      }
    }
    ctx.restore();
  }

  function drawShield(ctx, rig, hx, hy, a) {
    var s = rig.scale;
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(-a);
    ctx.fillStyle = '#4a4436';
    ctx.beginPath();
    ctx.moveTo(-9 * s, -12 * s); ctx.lineTo(9 * s, -12 * s);
    ctx.lineTo(9 * s, 6 * s); ctx.lineTo(0, 15 * s); ctx.lineTo(-9 * s, 6 * s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rig.accent; ctx.lineWidth = 1.8 * s; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.moveTo(-9 * s, -12 * s); ctx.lineTo(0, -12 * s); ctx.lineTo(0, 15 * s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ----------------------------------------------------------- head art --- */
  function drawHead(ctx, rig, x, y, a, facing, opts) {
    var s = rig.scale, R = rig.headR * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-a * 0.85);
    switch (rig.helm) {
      case 'hood':
        ctx.fillStyle = rig.dark;

        ctx.moveTo(-R * 1.15, R * 0.75);
        ctx.quadraticCurveTo(-R * 1.35, -R * 1.35, R * 0.15, -R * 1.30);
        ctx.quadraticCurveTo(R * 1.45, -R * 1.05, R * 1.05, R * 0.85);
        ctx.quadraticCurveTo(0, R * 1.25, -R * 1.15, R * 0.75);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#0b0a10';
        ctx.beginPath(); ctx.ellipse(R * 0.42, R * 0.02, R * 0.62, R * 0.55, 0, 0, 6.2832); ctx.fill();
        break;
      case 'horned':
        ctx.fillStyle = rig.mid;
        ctx.beginPath(); ctx.ellipse(0, 0, R * 1.02, R * 1.12, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#d8d2c4';
        ctx.beginPath();
        ctx.moveTo(-R * 0.5, -R * 0.75); ctx.quadraticCurveTo(-R * 2.1, -R * 1.9, -R * 1.0, -R * 0.15);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(R * 0.5, -R * 0.75); ctx.quadraticCurveTo(R * 2.1, -R * 1.9, R * 1.0, -R * 0.15);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#0b0a10';
        ctx.beginPath(); ctx.ellipse(R * 0.35, R * 0.05, R * 0.6, R * 0.42, 0, 0, 6.2832); ctx.fill();
        break;
      case 'plate':
        ctx.fillStyle = rig.mid;
        ctx.beginPath();
        ctx.moveTo(-R, -R * 0.9); ctx.lineTo(R * 0.95, -R * 1.0);
        ctx.lineTo(R * 1.1, R * 0.6); ctx.lineTo(0, R * 1.15); ctx.lineTo(-R * 1.05, R * 0.55);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#07070c';
        ctx.fillRect(R * 0.05, -R * 0.35, R * 1.0, R * 0.30);
        break;
      case 'crown':
        ctx.fillStyle = rig.mid;
        ctx.beginPath(); ctx.ellipse(0, 0, R * 1.0, R * 1.1, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#e0b64a';
        ctx.beginPath();
        ctx.moveTo(-R * 1.05, -R * 0.85);
        for (var i = 0; i <= 4; i++) {
          var fx = -R * 1.05 + (R * 2.1) * (i / 4);
          ctx.lineTo(fx, -R * (i % 2 ? 1.75 : 1.05));
        }
        ctx.lineTo(R * 1.05, -R * 0.85);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#07070c';
        ctx.beginPath(); ctx.ellipse(R * 0.32, R * 0.05, R * 0.58, R * 0.4, 0, 0, 6.2832); ctx.fill();
        break;
      case 'skull':
        ctx.fillStyle = '#ddd6c4';
        ctx.beginPath(); ctx.ellipse(0, -R * 0.1, R * 1.0, R * 1.05, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#1a1622';
        ctx.beginPath(); ctx.ellipse(R * 0.36, -R * 0.12, R * 0.3, R * 0.34, 0, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-R * 0.28, -R * 0.12, R * 0.26, R * 0.3, 0, 0, 6.2832); ctx.fill();
        ctx.fillRect(-R * 0.1, R * 0.5, R * 0.6, R * 0.4);
        break;
      default:
        ctx.fillStyle = rig.skin;
        ctx.beginPath(); ctx.ellipse(0, 0, R * 0.92, R * 1.0, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = rig.dark;
        ctx.beginPath(); ctx.ellipse(0, -R * 0.55, R * 0.98, R * 0.6, 0, 0, 6.2832); ctx.fill();

      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------- body ----- */
  /* Draws a humanoid centred at (cx, cy) — cy is the body centre, feet land

  function drawHumanoid(ctx, rig, p, cx, cy, facing, opts) {
    opts = opts || {};
    var s = rig.scale;
    var f = facing;

    ctx.save();
    ctx.translate(cx, cy + (p.bob || 0));
    ctx.scale(f, 1);
    if (p.squash !== 1) { ctx.scale(1 / Math.sqrt(p.squash), p.squash); }

    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;

    var darkC = opts.flat || rig.dark;
    var midC = opts.flat || rig.mid;
    var lightC = opts.flat || rig.light;

    var lean = p.lean;
    var hipX = 0, hipY = rig.hipY * s;
    // torso runs from hip upward, tilted by lean
    var shX = hipX + Math.sin(lean) * -rig.torso * s;
    var shY = hipY + Math.cos(lean) * -rig.torso * s;

    /* ---- cape (behind everything) ---- */
    if (rig.cape) {
      var ca = p.capeA;
      ctx.fillStyle = rig.cloth || '#3a1420';
      ctx.beginPath();
      ctx.moveTo(shX - 5 * s, shY - 1 * s);
      ctx.quadraticCurveTo(
        shX - 12 * s - Math.sin(ca) * 16 * s, shY + 12 * s,
        shX - 8 * s - Math.sin(ca) * 26 * s, shY + 30 * s + Math.cos(ca) * 4 * s
      );
      ctx.quadraticCurveTo(shX - 2 * s, shY + 26 * s, shX + 5 * s, shY + 2 * s);
      ctx.closePath(); ctx.fill();

    /* ---- far limbs ---- */
    limb(ctx, shX, shY, p.shB + lean, rig.upperArm * s, p.shB + p.elB + lean, rig.foreArm * s,
         rig.armW * s, rig.armW * 0.82 * s, rig.armW * 0.7 * s, darkC);
    limb(ctx, hipX, hipY, p.hipB, rig.thigh * s, p.hipB + p.knB, rig.shin * s,
         rig.legW * s, rig.legW * 0.8 * s, rig.legW * 0.72 * s, darkC);

    /* ---- torso ---- */
    ctx.fillStyle = midC;
    capsule(ctx, hipX, hipY, lean + Math.PI, rig.torso * s, rig.torsoW * s, rig.shoulderW * s);
    ctx.fill();
    // chest plate highlight (lit from the front-top)
    if (!opts.flat) {
      ctx.fillStyle = lightC;
      ctx.save();
      ctx.translate(shX, shY); ctx.rotate(-lean);
      ctx.beginPath();
      ctx.moveTo(0.5 * s, -1 * s);
      ctx.lineTo(rig.shoulderW * 0.44 * s, 1 * s);
      ctx.lineTo(rig.torsoW * 0.30 * s, rig.torso * 0.80 * s);
      ctx.lineTo(0.5 * s, rig.torso * 0.86 * s);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /* ---- near leg ---- */
    limb(ctx, hipX, hipY, p.hipA, rig.thigh * s, p.hipA + p.knA, rig.shin * s,
         rig.legW * 1.02 * s, rig.legW * 0.84 * s, rig.legW * 0.76 * s, midC);

    /* ---- head ---- */
    var hx = shX + Math.sin(lean) * -(rig.neck + rig.headR) * s;
    var hy = shY + Math.cos(lean) * -(rig.neck + rig.headR) * s;
    drawHead(ctx, rig, hx, hy, p.headA + lean * 0.5, f, opts);

    /* ---- near arm + weapon ---- */
    var arm = limb(ctx, shX, shY, p.shA + lean, rig.upperArm * s, p.shA + p.elA + lean, rig.foreArm * s,
                   rig.armW * 1.05 * s, rig.armW * 0.86 * s, rig.armW * 0.74 * s, lightC);
    if (rig.weapon) {
      drawWeapon(ctx, rig, rig.weapon, arm.end.x + (p.wpnX || 0) * s, arm.end.y + (p.wpnY || 0) * s,
                 p.shA + p.elA + lean + p.wpn, opts.weaponGlow || 0);
    }
    if (rig.shield) {
      var farEndX = shX + Math.sin(p.shB + lean) * rig.upperArm * s + Math.sin(p.shB + p.elB + lean) * rig.foreArm * s;
      var farEndY = shY + Math.cos(p.shB + lean) * rig.upperArm * s + Math.cos(p.shB + p.elB + lean) * rig.foreArm * s;
      drawShield(ctx, rig, farEndX, farEndY, p.shB + p.elB + lean);
    }

    /* ---- rim light on the leading edge ---- */
    if (!opts.flat && opts.rim !== false) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (opts.rimStrength == null ? 0.5 : opts.rimStrength);
      ctx.strokeStyle = rig.rim;
      ctx.lineWidth = 1.15 * s;
      ctx.beginPath();
      ctx.moveTo(hx + rig.headR * 0.75 * s, hy - rig.headR * 0.5 * s);
      ctx.quadraticCurveTo(shX + rig.shoulderW * 0.5 * s, shY + 1 * s, hipX + rig.torsoW * 0.42 * s, hipY);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();
  }

  /* ----------------------------------------------------- non-humanoids --- */

  function drawBat(ctx, x, y, facing, t, opts) {
    opts = opts || {};
    var s = opts.scale || 1;
    var flap = Math.sin(t * 17) * 0.9;
    ctx.save();
    ctx.translate(x, y); ctx.scale(facing, 1);
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    var body = opts.flat || '#231b2b';
    var wing = opts.flat || '#1a1422';
    for (var w = -1; w <= 1; w += 2) {
      ctx.save();
      ctx.scale(1, 1);
      ctx.fillStyle = wing;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      var sp = 20 * s * (1 - Math.abs(flap) * 0.35);
      ctx.quadraticCurveTo(w * sp * 0.6, -8 * s + flap * 9 * s, w * sp, flap * 5 * s);
      ctx.quadraticCurveTo(w * sp * 0.75, 8 * s + flap * 4 * s, w * sp * 0.32, 7 * s);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ellipse(ctx, 0, 0, 7 * s, 8.5 * s, 0, body);
    ellipse(ctx, 3 * s, -5 * s, 5 * s, 4.6 * s, 0, body);
    // ears
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(1 * s, -8 * s); ctx.lineTo(3 * s, -14 * s); ctx.lineTo(5.5 * s, -8 * s); ctx.closePath(); ctx.fill();
    if (opts.eyeGlow > 0 && !opts.flat) {
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createRadialGradient(4.5 * s, -5 * s, 0, 4.5 * s, -5 * s, 7 * s);
      g.addColorStop(0, opts.eyeCol || '#ff5a4a'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(4.5 * s, -5 * s, 7 * s, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  /* Floating cloaked wraith — no legs, trailing tatters. */
  function drawWraith(ctx, x, y, facing, t, opts) {
    opts = opts || {};
    var s = opts.scale || 1;
    ctx.save();
    ctx.translate(x, y); ctx.scale(facing, 1);
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    var col = opts.flat || '#241c33';
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-10 * s, -14 * s);
    ctx.quadraticCurveTo(0, -24 * s, 10 * s, -14 * s);
    for (var i = 0; i < 5; i++) {
      var px = 10 * s - (20 * s) * (i / 4);
      var wob = Math.sin(t * 4 + i * 1.6) * 5 * s;
      ctx.quadraticCurveTo(px - 2 * s + wob, 14 * s + i * 2 * s, px - 4 * s, 22 * s + wob);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0a0810';
    ctx.beginPath(); ctx.ellipse(2 * s, -13 * s, 6 * s, 6.5 * s, 0, 0, 6.2832); ctx.fill();
    if (opts.eyeGlow > 0 && !opts.flat) {
      ctx.globalCompositeOperation = 'lighter';
      for (var e = 0; e < 2; e++) {
        var ex = (0 + e * 4) * s, ey = -13 * s;
        var g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 7 * s);
        g.addColorStop(0, opts.eyeCol || '#9df'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 7 * s, 0, 6.2832); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  return {
    capsule: capsule, limb: limb, ellipse: ellipse,
    makeRig: makeRig, pose: pose, mix: mix, P: P,
    drawHumanoid: drawHumanoid, drawWeapon: drawWeapon, drawHead: drawHead,
    drawBat: drawBat, drawWraith: drawWraith
  };
})();


/* ==== 05_player.js ================================================== */
/* ==========================================================================
   GRIMHOLLOW  —  05_player.js
   The hero. State machine + 3-hit combo chain, dash-attack, plunge, parry,
   coyote time, jump buffering, wall-jump, stamina.
   ========================================================================== */

var G = (typeof G !== 'undefined') ? G : {};

G.Player = (function () {
  var K = G.K, M = G.M, A = G.Art, In = G.Input;

  /* Attack definitions. Timing in seconds; reach/height in px.
     `lunge` is the forward impulse applied on the active frame — this is what
     makes swings feel like they commit weight rather than flail in place. */
  var ATK = {
    a1: { wind: 0.055, act: 0.085, rec: 0.115, dmg: 13, reach: 38, hy: 30, off: 16, lunge: 145, kb: 165, heavy: false, stam: 0 },
    a2: { wind: 0.055, act: 0.085, rec: 0.135, dmg: 15, reach: 40, hy: 32, off: 17, lunge: 160, kb: 180, heavy: false, stam: 0 },
    a3: { wind: 0.125, act: 0.110, rec: 0.245, dmg: 29, reach: 46, hy: 44, off: 19, lunge: 210, kb: 330, heavy: true, stam: 0 },
    air: { wind: 0.055, act: 0.100, rec: 0.130, dmg: 15, reach: 40, hy: 38, off: 15, lunge: 60, kb: 190, heavy: false, stam: 0 },
    dash: { wind: 0.030, act: 0.115, rec: 0.155, dmg: 21, reach: 46, hy: 32, off: 20, lunge: 460, kb: 250, heavy: false, stam: 8 },
    plunge: { wind: 0.10, act: 0.001, rec: 0.20, dmg: 34, reach: 74, hy: 40, off: 0, lunge: 0, kb: 380, heavy: true, stam: 10 }
  };

  function Player(game, x, y) {
    this.game = game;
    this.body = new G.Body(x, y, 22, 42);
    this.facing = 1;
    this.state = 'idle';
    this.stateT = 0;
    this.animT = 0;
    this.runCycle = 0;

    this.maxHp = K.BASE_HP;
    this.hp = this.maxHp;
    this.maxStam = K.BASE_STAMINA;
    this.stam = this.maxStam;
    this.stamDelay = 0;

    this.coyote = 0;
    this.jumpBuf = 0;
    this.jumpHeld = false;
    this.jumpsLeft = 1;
    this.airDashUsed = false;
    this.wallLock = 0;
    this.lastWallDir = 0;

    this.dashT = 0;
    this.dashCd = 0;
    this.iframe = 0;
    this.invuln = 0;

    this.atk = null;         // active attack def
    this.atkName = '';
    this.atkPhase = '';
    this.atkT = 0;
    this.atkHit = null;      // Set of entities already struck by this swing
    this.comboStep = 0;
    this.comboTimer = 0;
    this.atkBuffer = 0;
    this.didLunge = false;

    this.blocking = false;
    this.blockT = 0;
    this.parryFlash = 0;
    this.blockBreak = 0;

    this.hurtT = 0;
    this.dead = false;
    this.deadT = 0;

    this.plunging = false;
    this.plungeCharge = 0;

    this.weaponGlow = 0;
    this.eyeGlow = 0.35;
    this.lanternPhase = Math.random() * 6.28;
    this.footstepT = 0;

    this.rig = A.makeRig({
      dark: '#171422', mid: '#272033', light: '#3a3049',
      accent: '#c98a3f', cloth: '#5c1a28', cape: true,
      weapon: 'sword', helm: 'hood', rim: 'rgba(200,225,255,0.75)',
      scale: 1.0
    });
    this.pose = A.P.idle;
    this.lastPose = A.P.idle;
  }

  Player.prototype.applyStats = function (save) {
    var st = save.stats;
    this.maxHp = K.BASE_HP + st.vitality * 22;
    this.maxStam = K.BASE_STAMINA + st.stamina * 18;
    this.powerMul = 1 + st.power * 0.16;
    this.speedMul = 1 + st.speed * 0.055;
    this.fortuneMul = 1 + st.fortune * 0.22;
    this.focusMul = 1 + st.focus * 0.18;      // stamina regen + parry window
    this.abilities = save.abilities;
    this.hp = Math.min(this.hp || this.maxHp, this.maxHp);
    this.stam = this.maxStam;
  };

  Player.prototype.resetForLevel = function (x, y) {
    this.body.x = x; this.body.y = y;
    this.body.vx = this.body.vy = 0;
    this.hp = this.maxHp; this.stam = this.maxStam;
    this.state = 'idle'; this.dead = false; this.deadT = 0;
    this.atk = null; this.atkPhase = ''; this.comboStep = 0;
    this.iframe = 0; this.invuln = 0; this.hurtT = 0;
    this.dashT = 0; this.dashCd = 0; this.plunging = false;
    this.jumpsLeft = this.maxJumps(); this.airDashUsed = false;
    this.facing = 1;
  };

  Player.prototype.maxJumps = function () {
    return 2;
  };

  Player.prototype.centerX = function () { return this.body.cx(); };
  Player.prototype.centerY = function () { return this.body.cy(); };

  /* --------------------------------------------------------- attacking --- */

  Player.prototype.canAct = function () {
    return !this.dead && this.state !== 'hurt' && this.hurtT <= 0;
  };

  Player.prototype.startAttack = function (name) {
    var d = ATK[name];
    if (!d) return;
    if (d.stam > 0) {
      if (this.stam < d.stam) return;
      this.stam -= d.stam; this.stamDelay = K.STAM_REGEN_DELAY;
    }
    this.atk = d; this.atkName = name;
    this.atkPhase = 'wind'; this.atkT = 0;
    this.atkHit = [];
    this.didLunge = false;
    this.blocking = false;
    this.state = 'attack';
    this.weaponGlow = 1;
    G.Audio.play('swing', this.comboStep);
  };

  Player.prototype.tryAttack = function () {
    if (!this.canAct()) { this.atkBuffer = 0.16; return; }

    // Plunge: down + attack while airborne (relic-gated)
    if (!this.body.onGround && In.down('down') && this.abilities && this.abilities.plunge && !this.plunging) {
      this.startAttack('plunge');
      this.plunging = true;
      this.body.vx *= 0.2; this.body.vy = -110;
      this.plungeCharge = 0;
      return;
    }
    // Dash-attack: attack while dashing (relic-gated)
    if (this.dashT > 0 && this.abilities && this.abilities.dashAttack) {
      this.dashT = 0;
      this.startAttack('dash');
      return;
    }
    if (!this.body.onGround) { this.startAttack('air'); return; }

    // Ground combo chain — window keeps the chain alive between swings
    if (this.comboTimer > 0) this.comboStep = (this.comboStep + 1) % 3;
    else this.comboStep = 0;
    this.comboTimer = 0;
    this.startAttack(['a1', 'a2', 'a3'][this.comboStep]);
  };

  Player.prototype.attackHitbox = function () {
    if (!this.atk || this.atkPhase !== 'active') return null;
    var d = this.atk;
    if (this.atkName === 'plunge') {
      // ground-slam AoE centred on the feet
      return { x: this.body.cx() - d.reach, y: this.body.y + this.body.h - 18, w: d.reach * 2, h: 30 };
    }
    var x = this.facing > 0 ? this.body.x + this.body.w * 0.5 + d.off * 0.2
                            : this.body.x + this.body.w * 0.5 - d.reach - d.off * 0.2;
    var y = this.body.cy() - d.hy * 0.5 + (this.atkName === 'a3' ? -4 : 0);
    return { x: x, y: y, w: d.reach, h: d.hy };
  };

  Player.prototype.spawnSlashFx = function () {
    var d = this.atk, g = this.game;
    var cx = this.body.cx() + this.facing * 14, cy = this.body.cy() - 2;
    var col = 'rgba(230,245,255,0.92)';
    if (this.atkName === 'a1') g.slashes.add({ x: cx, y: cy, r: d.reach * 0.95, a0: -1.15, a1: 0.95, life: 0.13, width: 12, col: col, dir: this.facing });
    else if (this.atkName === 'a2') g.slashes.add({ x: cx, y: cy, r: d.reach * 0.95, a0: 1.0, a1: -1.15, life: 0.13, width: 12, col: col, dir: this.facing });
    else if (this.atkName === 'a3') g.slashes.add({ x: cx, y: cy - 4, r: d.reach * 1.05, a0: -1.9, a1: 1.15, life: 0.20, width: 19, col: 'rgba(255,236,200,0.95)', dir: this.facing });
    else if (this.atkName === 'dash') g.slashes.add({ x: cx, y: cy, r: d.reach, a0: -0.5, a1: 0.5, life: 0.16, width: 22, col: 'rgba(190,235,255,0.95)', dir: this.facing });
    else if (this.atkName === 'air') g.slashes.add({ x: cx, y: cy, r: d.reach, a0: -1.5, a1: 1.5, life: 0.16, width: 14, col: col, dir: this.facing });
    else if (this.atkName === 'plunge') {
      g.particles.shockwave(this.body.cx(), this.body.y + this.body.h, 150, '#ffd08a');
      g.particles.rubble(this.body.cx(), this.body.y + this.body.h, 18);
      g.particles.landPuff(this.body.cx(), this.body.y + this.body.h, true);
      g.camera.addShake(13);
      G.Audio.play('slam');
    }
    // faint air-displacement puff
    g.particles.dust(cx + this.facing * 10, cy, 4, 14, 'rgba(200,220,255,0.22)');
  };

  Player.prototype.resolveAttackHits = function () {
    var hb = this.attackHitbox();
    if (!hb) return;
    var g = this.game, hits = 0;
    for (var i = 0; i < g.enemies.length; i++) {
      var e = g.enemies[i];
      if (e.dead || e.spawning > 0) continue;
      if (this.atkHit.indexOf(e) >= 0) continue;
      var eb = e.hurtbox ? e.hurtbox() : { x: e.body.x, y: e.body.y, w: e.body.w, h: e.body.h };
      if (!M.aabb(hb.x, hb.y, hb.w, hb.h, eb.x, eb.y, eb.w, eb.h)) continue;
      this.atkHit.push(e);
      var dmg = this.atk.dmg * (this.powerMul || 1);
      var dir = M.sign(e.body.cx() - this.body.cx()) || this.facing;
      var res = e.takeDamage(dmg, dir, {
        kb: this.atk.kb, heavy: this.atk.heavy, source: this,
        plunge: this.atkName === 'plunge'
      });
      hits++;
      if (res === 'blocked') {
        g.particles.hitSparks(eb.x + eb.w * 0.5 - dir * 10, this.body.cy(), dir, false);
        g.hitstop.add(0.06);
        g.camera.addShake(3);
        G.Audio.play('block');
        // shields bounce you back — teaches you to go around
        this.body.vx = -dir * 190;
        continue;
      }
      var px = M.clamp(this.body.cx() + this.facing * 26, eb.x, eb.x + eb.w);
      g.particles.hitSparks(px, this.body.cy() - 2, this.facing, this.atk.heavy);
      g.particles.blood(px, this.body.cy() - 2, this.facing, this.atk.heavy ? 16 : 9);
      g.hitstop.add(this.atk.heavy ? K.HITSTOP_HEAVY : K.HITSTOP);
      g.camera.addShake(this.atk.heavy ? 8.5 : 4.5);
      g.flash.pop(this.atk.heavy ? 0.16 : 0.07, '#fff2d8');
      G.Audio.play(this.atk.heavy ? 'crit' : 'hit', this.atk.heavy);
      // A landed hit refunds a sliver of stamina — rewards aggression.
      this.stam = Math.min(this.maxStam, this.stam + 5);
    }
    if (hits && !this.body.onGround && this.atkName === 'air') {
      this.body.vy = Math.min(this.body.vy, -150);   // small pogo on air hit
      this.jumpsLeft = Math.max(this.jumpsLeft, 1);
    }
  };

  /* ------------------------------------------------------------ damage --- */

  Player.prototype.takeDamage = function (amount, dirX, opts) {
    opts = opts || {};
    if (this.dead) return 'dead';
    if (this.iframe > 0 || this.invuln > 0) return 'iframe';

    var g = this.game;
    var fromFront = (dirX === 0) || (M.sign(dirX) === -this.facing) || (M.sign(dirX) === this.facing ? false : true);
    // dirX is the direction the hit pushes the player. Facing the source means
    // the push direction is opposite to our facing.
    fromFront = (M.sign(dirX) !== this.facing) || dirX === 0;

    if (this.blocking && fromFront) {
      var pw = K.PARRY_WINDOW * (this.focusMul || 1);
      if (this.blockT <= pw && !opts.unblockable) {
        // ---- PERFECT PARRY ----
        this.parryFlash = 1;
        this.stam = Math.min(this.maxStam, this.stam + 28);
        g.particles.parryBurst(this.body.cx() + this.facing * 18, this.body.cy());
        g.hitstop.add(0.15, 0.02);
        g.camera.addShake(9);
        g.flash.pop(0.42, '#dff2ff');
        g.floatText.add(this.body.cx(), this.body.y - 8, 'PARRY', '#bfe8ff', 15);
        G.Audio.play('parry');
        if (opts.source && opts.source.stagger) opts.source.stagger(K.PARRY_STUN);
        this.body.vx = -M.sign(dirX || -this.facing) * 90;
        this.iframe = 0.28;
        g.onParry();
        return 'parried';
      }
      if (!opts.unblockable && this.stam >= K.STAM_BLOCK) {
        // ---- CHIP BLOCK ----
        this.stam -= K.STAM_BLOCK; this.stamDelay = K.STAM_REGEN_DELAY;
        amount *= 0.25;
        g.particles.hitSparks(this.body.cx() + this.facing * 16, this.body.cy(), this.facing, false);
        g.camera.addShake(4);
        G.Audio.play('block');
        this.hp -= amount;
        this.body.vx = M.sign(dirX || -this.facing) * 150;
        this.iframe = 0.20;
        if (this.stam < K.STAM_BLOCK) {
          this.blockBreak = 0.6; this.blocking = false;
          g.floatText.add(this.body.cx(), this.body.y - 8, 'GUARD BROKEN', '#ff9a5a', 12);
        }
        if (this.hp <= 0) this.die();
        return 'blocked';
      }
    }

    /* ---- full hit ---- */
    this.hp -= amount;
    this.iframe = K.INVULN_ON_HIT;
    this.hurtT = 0.28;
    this.state = 'hurt';
    this.atk = null; this.atkPhase = ''; this.plunging = false;
    this.blocking = false;
    this.dashT = 0;
    var kb = opts.kb == null ? 220 : opts.kb;
    this.body.vx = M.sign(dirX || -this.facing) * kb;
    this.body.vy = Math.min(this.body.vy, -190);

    g.particles.blood(this.body.cx(), this.body.cy(), M.sign(dirX || 1), 18);
    g.hitstop.add(0.09);
    g.camera.addShake(11);
    g.flash.pop(0.30, '#ff5a4a');
    g.flash.hurt();
    g.floatText.add(this.body.cx(), this.body.y - 6, '-' + Math.round(amount), '#ff8a7a', 14);
    G.Audio.play('hurt');

    if (this.hp <= 0) this.die();
    return 'hit';
  };

  Player.prototype.die = function () {
    if (this.dead) return;
    this.hp = 0;
    this.dead = true;
    this.deadT = 0;
    this.state = 'dead';
    this.game.particles.death(this.body.cx(), this.body.cy(), '#3a2030');
    this.game.camera.addShake(16);
    this.game.flash.pop(0.6, '#5a0c14');
    G.Audio.play('die');
    this.game.onPlayerDeath();
  };

  Player.prototype.heal = function (amount) {
    var before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + amount);
    if (this.hp > before) {
      this.game.particles.heal(this.body.cx(), this.body.cy());
      this.game.floatText.add(this.body.cx(), this.body.y - 8, '+' + Math.round(this.hp - before), '#7dffb2', 14);
      G.Audio.play('heal');
    }
  };

  Player.prototype.usePotion = function () {
    var s = this.game.save;
    if (s.potions <= 0 || this.dead) { G.Audio.play('ui'); return; }
    if (this.hp >= this.maxHp) { this.game.floatText.add(this.body.cx(), this.body.y - 8, 'FULL', '#9aa', 11); return; }
    s.potions--;
    this.heal(K.POTION_HEAL + (this.game.save.stats.focus * 8));
  };

  Player.prototype.stagger = function () { /* player has no stagger; hurt covers it */ };

  /* ------------------------------------------------------------ update --- */

  Player.prototype.update = function (dt, world) {
    var b = this.body, g = this.game;
    this.animT += dt;
    this.stateT += dt;

    if (this.dead) {
      this.deadT += dt;
      b.applyGravity(dt);
      b.vx = M.approach(b.vx, 0, 900 * dt);
      b.move(world, dt);
      this.pose = A.mix(this.pose, A.P.dead, Math.min(1, dt * 9));
      return;
    }

    /* timers */
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.iframe = Math.max(0, this.iframe - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.comboTimer = Math.max(0, this.comboTimer - dt);
    this.atkBuffer = Math.max(0, this.atkBuffer - dt);
    this.wallLock = Math.max(0, this.wallLock - dt);
    this.parryFlash = Math.max(0, this.parryFlash - dt * 3.2);
    this.blockBreak = Math.max(0, this.blockBreak - dt);
    this.weaponGlow = Math.max(0, this.weaponGlow - dt * 3.5);
    this.hurtT = Math.max(0, this.hurtT - dt);

    /* stamina */
    if (this.stamDelay > 0) this.stamDelay -= dt;
    else if (!this.blocking) this.stam = Math.min(this.maxStam, this.stam + K.STAM_REGEN * (this.focusMul || 1) * dt);

    /* ------------------------------------------------ input intentions --- */
    var ax = In.axis();
    var wantJump = In.consume('jump');
    if (wantJump) this.jumpBuf = K.JUMP_BUFFER;
    else this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    this.jumpHeld = In.down('jump');

    if (In.consume('attack')) this.atkBuffer = 0.18;
    if (In.consume('potion')) this.usePotion();

    /* ------------------------------------------------------- block/parry - */
    var wantBlock = In.down('block') && this.blockBreak <= 0 && this.canAct() &&
                    !this.atk && this.dashT <= 0 && this.stam > 2;

      case 'fall': target = P.fall; blend = 10; break;
      case 'land': target = P.land; blend = 28; break;
      case 'wall': target = P.wall; blend = 18; break;
      case 'dash': target = P.dash; blend = 30; break;

var G = (typeof G !== 'undefined') ? G : {};

/* ---------------------------------------------------------- projectile ---- */
G.Projectile = (function () {
  var M = G.M;

  function Projectile(game, o) {
    this.game = game;
    this.x = o.x; this.y = o.y;
    this.vx = o.vx; this.vy = o.vy;
    this.grav = o.grav || 0;
    this.dmg = o.dmg || 12;

    this.life = o.life || 4;

    this.owner = o.owner || null;
    this.hostile = o.hostile !== false;   // false = reflected, hurts enemies
    this.dead = false;

  Projectile.prototype.update = function (dt, world) {

    if (this.homing > 0 && this.hostile && p && !p.dead) {
      var ang = Math.atan2(p.body.cy() - this.y, p.body.cx() - this.x);
      var cur = Math.atan2(this.vy, this.vx);
      var na = M.lerpAngle(cur, ang, Math.min(1, this.homing * dt));
      var sp = M.len(this.vx, this.vy);

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    else this.rot += dt * 6;
    this.spin += dt * 12;

    if (this.trail && Math.random() < 0.6) {
      g.particles.spawn({
        x: this.x, y: this.y, vx: -this.vx * 0.05, vy: -this.vy * 0.05,
        life: 0.2, size: this.r * 0.8, kind: 2, drag: 3,
        col: this.hostile ? 'rgba(255,150,90,0.35)' : 'rgba(160,220,255,0.4)'
      });

    if (world.isSolid(Math.floor(this.x / G.K.TILE), Math.floor(this.y / G.K.TILE))) {
      this.impact(); return;
    }
    if (this.x < -40 || this.x > world.pixelW() + 40 || this.y > world.pixelH() + 60) { this.dead = true; return; }

    if (this.hostile) {
      if (p && !p.dead && M.aabb(this.x - this.r, this.y - this.r, this.r * 2, this.r * 2,

  Projectile.prototype.draw = function (ctx) {

      ctx.fillStyle = 'rgba(230,230,230,0.7)';

    } else if (this.kind === 'orb') {

      var g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, this.r * 3);
      g2.addColorStop(0, c); g2.addColorStop(0.4, this.hostile ? 'rgba(190,90,255,0.55)' : 'rgba(120,200,255,0.55)');

      alpha: alpha, eyeGlow: this.eyeGlow, eyeCol: t.rig && t.rig.eyeCol,
      flat: flat, rimStrength: 0.4 + (this.state === 'windup' ? 0.5 : 0)

      ctx.fillStyle = this.elite ? '#e0b64a' : '#c0392b';
      ctx.fillRect(hx, hy, w * Math.max(0, this.hp / this.maxHp), 2.5);

        ctx.fillStyle = 'rgba(255,255,255,0.5)';

    A.drawHumanoid(ctx, this.rig, gh.pose || this.pose, gh.x + gh.w * 0.5, gh.y + gh.h * 0.5 - 2, gh.facing,

  };

      var c = this.type === 'assassin' ? [110, 240, 255] :
              this.type === 'wraith' ? [190, 138, 255] :
              this.type === 'shielder' ? [159, 224, 138] : [255, 122, 74];
      out.push({ x: b.cx() + this.facing * 4, y: b.cy() - b.h * 0.32, r: 46 + eg * 44, col: c, a: 0.30 + eg * 0.35 });
    }

      out.push({ x: b.cx(), y: b.cy(), r: 120, col: [255, 110, 60], a: 0.4 * M.clamp(this.tellT / t.tell, 0, 1) });
    }
  };

  return Enemy;
})();

/* ==========================================================================
   GRIMHOLLOW  —  07_bosses.js
   Three multi-phase bosses driven by a shared action runner.
   An "action" is a data record: tell → active → recover, with optional
   movement, projectile spawns and chain-into-next. Adding a new boss attack
   means adding a table entry, not new control flow.

    this.dmg = o.dmg || 20;
    this.life = o.life || 2.4;
    this.h = o.h || 34;
    this.w = 22;
    this.dead = false;
    this.hostile = true;
    this.hit = false;
    this.col = o.col || '#ff9a5a';
    this.unblockable = !!o.unblockable;
    this.t = 0;

  Wave.prototype.update = function (dt, world) {
    this.t += dt;
    this.life -= dt;

    this.x += this.vx * dt;

    else if (!world.isSolid(tx, ty + 1) && !world.isPlatform(tx, ty + 1)) this.y += Math.min(200 * dt, K.TILE);
    if (world.isSolid(tx, Math.floor((this.y - this.h * 0.5) / K.TILE))) { this.dead = true; return; }
    if (this.x < -40 || this.x > world.pixelW() + 40) { this.dead = true; return; }

    if (Math.random() < 0.8) {
      this.game.particles.spawn({
        x: this.x + (Math.random() - 0.5) * 20, y: this.y - Math.random() * this.h,
        vx: this.vx * 0.1 + (Math.random() - 0.5) * 60, vy: -60 - Math.random() * 150,
        life: 0.3, size: 2 + Math.random() * 4, col: this.col, kind: 1, drag: 2.4, glow: 1
      });
    }
    var p = this.game.player;
    if (!this.hit && p && !p.dead &&
        M.aabb(this.x - this.w * 0.5, this.y - this.h, this.w, this.h, p.body.x, p.body.y, p.body.w, p.body.h)) {
      this.hit = true;
      p.takeDamage(this.dmg, M.sign(this.vx), { kb: 300, unblockable: this.unblockable });
      this.dead = true;

    var k = G.M.clamp(this.life / 0.5, 0, 1);

    ctx.globalAlpha = 0.75 * k;
    var g = ctx.createLinearGradient(this.x, this.y, this.x, this.y - this.h);
    g.addColorStop(0, this.col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(this.x - 14, this.y);
    ctx.quadraticCurveTo(this.x, this.y - this.h * 1.25, this.x + 14, this.y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  Wave.prototype.lights = function (out) {
    out.push({ x: this.x, y: this.y - this.h * 0.4, r: 90, col: [255, 150, 80], a: 0.5 });
  };
  return Wave;
})();
